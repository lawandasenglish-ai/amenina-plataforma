.sb-logo{max-width:130px;display:block;margin-bottom:10px;}
.sb-uw{display:flex;align-items:center;gap:9px;}
.sb-av{width:34px;height:34px;border-radius:50%;background:rgba(247,198,211,.18);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--cp);flex-shrink:0;}
.sb-un{font-size:13px;font-weight:700;color:var(--ccream);}
.sb-rb{font-size:9px;background:rgba(247,198,211,.15);color:var(--cp);padding:2px 7px;border-radius:10px;margin-top:2px;display:inline-block;}
.sb-nav{flex:1;overflow-y:auto;padding:8px 0;}
.sb-sec{font-size:9px;font-weight:700;color:rgba(247,198,211,.4);padding:10px 16px 3px;text-transform:uppercase;letter-spacing:.08em;}
.ni{display:flex;align-items:center;gap:9px;padding:8px 16px;cursor:pointer;color:rgba(247,198,211,.65);font-size:12px;font-weight:500;transition:all .12s;}
.ni:hover{background:rgba(247,198,211,.07);color:var(--cp);}
.ni.active{background:rgba(247,198,211,.13);color:var(--ccream);font-weight:700;}
.ni i{font-size:15px;flex-shrink:0;}
.nil{flex:1;}
.nb{background:var(--cr);color:var(--ccream);font-size:9px;padding:1px 6px;border-radius:10px;font-weight:700;margin-left:auto;}
.sb-foot{padding:10px 12px;border-top:1px solid rgba(247,198,211,.07);display:flex;flex-direction:column;gap:6px;}
.sb-switch-btn{width:100%;padding:7px;background:rgba(247,198,211,.1);border:1px solid rgba(247,198,211,.2);border-radius:7px;color:var(--cp);font-size:11px;cursor:pointer;font-family:var(--font-sans);display:flex;align-items:center;justify-content:center;gap:7px;transition:all .15s;}
.sb-switch-btn:hover{background:rgba(247,198,211,.18);}
.sb-out{width:100%;padding:7px;background:transparent;border:1px solid rgba(247,198,211,.15);border-radius:7px;color:rgba(247,198,211,.5);font-size:11px;cursor:pointer;font-family:var(--font-sans);display:flex;align-items:center;justify-content:center;gap:7px;transition:all .15s;}
.sb-out:hover{background:rgba(247,198,211,.07);color:var(--cp);}
.mw{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:0 24px;height:58px;background:var(--ccard);border-bottom:1px solid rgba(121,20,40,.06);flex-shrink:0;}
.tb-l{display:flex;align-items:center;gap:10px;}
.btn-menu-mobile{display:none;background:none;border:none;font-size:22px;color:var(--cd);cursor:pointer;padding:4px 6px;flex-shrink:0;}
#sb-backdrop{display:none;}
.tb-l h1{font-family:var(--font-serif);font-size:20px;color:var(--cd);}
.tbs{font-size:11px;color:var(--crose);margin-top:1px;}
.tb-r{display:flex;gap:8px;align-items:center;}
.pc{flex:1;overflow-y:auto;padding:20px 24px;background:var(--cbg);}
.pc::-webkit-scrollbar{width:4px;}
.pc::-webkit-scrollbar-thumb{background:rgba(121,20,40,.15);border-radius:4px;}

/* ══ COMPONENTES ══ */
.card{background:var(--ccard);border-radius:11px;border:1px solid rgba(121,20,40,.07);padding:18px;margin-bottom:14px;}
.card.warn{border-color:rgba(220,53,69,.2);background:#fff8f8;}
.card.ok{border-color:rgba(45,106,16,.2);background:#f8fff8;}
.ch{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.ch h3{font-size:14px;font-weight:700;color:var(--cd);flex:1;}
.ch i{color:var(--cr);font-size:18px;}
.cha{font-size:11px;color:var(--crose);background:none;border:none;cursor:pointer;font-family:var(--font-sans);}
.sg{display:grid;gap:12px;margin-bottom:14px;}
.g2{grid-template-columns:repeat(2,1fr);}
.g3{grid-template-columns:repeat(3,1fr);}
.g4{grid-template-columns:repeat(4,1fr);}
.sc{background:var(--ccard);border-radius:10px;padding:14px 16px;border:1px solid rgba(121,20,40,.07);}
.sc.warn{border-color:rgba(220,53,69,.2);background:#fff8f8;}
.sc-filtro{transition:all .15s;cursor:pointer;}
.sc-filtro:hover{border-color:var(--cr);}
.sc-filtro.sc-filtro-ativo{border-color:var(--cr);border-width:2px;box-shadow:0 0 0 2px rgba(121,20,40,.08);}
.sc.ok{border-color:rgba(45,106,16,.2);}
.sl{font-size:11px;color:var(--crose);font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px;}
.sv{font-size:26px;font-weight:700;color:var(--cd);font-family:var(--font-serif);}
.ss{font-size:11px;color:var(--crose);margin-top:2px;}

/* ══ BOTÕES ══ */
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:8px;font-size:12px;font-weight:600;font-family:var(--font-sans);cursor:pointer;border:none;transition:all .15s;}
.btn-primary{background:var(--cr);color:var(--ccream);}
.btn-primary:hover{background:var(--cd);}
.btn-ghost{background:transparent;color:var(--crose);border:1px solid rgba(121,20,40,.18);}
.btn-ghost:hover{background:rgba(121,20,40,.05);}
.btn-success{background:#2d6a10;color:#fff;}
.btn-success:hover{background:#1e4a0b;}
.btn-sm{padding:5px 10px;font-size:11px;}

/* ══ TABELA ══ */
.tbl{width:100%;border-collapse:collapse;font-size:12px;}
.tbl th{background:rgba(121,20,40,.04);color:var(--crose);font-size:10px;font-weight:700;text-transform:uppercase;padding:8px 12px;text-align:left;border-bottom:1px solid rgba(121,20,40,.08);}
.tbl td{padding:10px 12px;border-bottom:1px solid rgba(121,20,40,.04);color:var(--cd);}
.tbl tr:hover td{background:rgba(121,20,40,.02);}
.tbl .nm{font-weight:600;}
.tbl .act{cursor:pointer;color:var(--crose);}

/* ══ BADGE ══ */
.badge{display:inline-flex;align-items:center;padding:2px 9px;border-radius:20px;font-size:10px;font-weight:600;}
.badge-ok{background:rgba(45,106,16,.1);color:#2d6a10;}
.badge-warn{background:rgba(255,193,7,.15);color:#7a5200;}
.badge-err{background:rgba(220,53,69,.1);color:#c0392b;}
.badge-info{background:rgba(26,79,160,.1);color:#1a4fa0;}
.badge-gray{background:rgba(121,20,40,.07);color:var(--crose);}

/* ══ FORMULÁRIO ══ */
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;}
.fg{display:flex;flex-direction:column;gap:5px;}
.fg label{font-size:11px;font-weight:700;color:var(--crose);text-transform:uppercase;letter-spacing:.05em;}
.fg input,.fg select,.fg textarea{padding:10px 12px;border-radius:8px;border:1.5px solid rgba(121,20,40,.18);background:#fff;color:var(--cd);font-size:13px;font-family:var(--font-sans);outline:none;transition:border .15s;width:100%;}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--cr);}
.fst{font-size:11px;font-weight:700;color:var(--crose);text-transform:uppercase;letter-spacing:.05em;padding:10px 0 6px;border-bottom:1px solid rgba(121,20,40,.07);margin-bottom:12px;}

/* ══ MODAL ══ */
#mo{position:fixed;inset:0;background:rgba(70,16,23,.45);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px;}
#mwrap{background:var(--ccard);border-radius:14px;width:100%;max-width:680px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(70,16,23,.25);}
#mbody{padding:24px;}
.mhdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;}
.mhdr h2{font-family:var(--font-serif);font-size:20px;color:var(--cd);}
.mclose{background:none;border:none;font-size:20px;cursor:pointer;color:var(--crose);padding:4px;}
.mftr{display:flex;justify-content:flex-end;gap:10px;margin-top:20px;padding-top:16px;border-top:1px solid rgba(121,20,40,.07);}

/* ══ GRADE DE HORÁRIOS ══ */
.schedule-wrap{overflow-x:auto;}
.schedule-table{border-collapse:collapse;width:100%;font-size:11px;}
.schedule-table th{background:var(--cd);color:var(--ccream);padding:6px 4px;text-align:center;font-size:11px;font-weight:600;border:1px solid rgba(247,198,211,.1);white-space:nowrap;}
.schedule-table td{border:1px solid rgba(121,20,40,.1);padding:0;vertical-align:middle;min-width:90px;height:36px;text-align:center;}
.schedule-table .time-col{background:var(--cd);color:var(--cp);padding:4px 8px;font-size:11px;font-weight:700;text-align:center;white-space:nowrap;width:55px;}
.slot{width:100%;height:100%;padding:4px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:background .12s;min-height:36px;}
.slot.fixo{background:#e8f4df;}
.slot.flexivel{background:#e8f0fc;}
.slot.reposicao{background:#fef3e0;}
.slot.bloqueado{background:#fceaf0;}
.slot-nome{font-size:11px;font-weight:700;color:var(--cd);line-height:1.2;text-align:center;}
.slot-tipo{font-size:9px;color:var(--crose);text-align:center;}
.slot-legend{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:10px;}
.slot-legend-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--cd);}
.slot-legend-dot{width:12px;height:12px;border-radius:3px;}
.hora-livre{cursor:pointer;transition:all .15s;}
.hora-livre:hover{background:rgba(45,106,16,.2)!important;}
.hora-livre.selecionada{background:rgba(45,106,16,.35)!important;outline:2px solid #2d6a10;}

/* ══ NOTAS DIRETORIA ══ */
.nota-card{border-radius:12px;padding:18px;border:1px solid rgba(0,0,0,.08);margin-bottom:12px;}

/* ══ LOGIN ══ */
#screen-login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--cd) 0%,var(--cr) 100%);}
.login-box{background:var(--ccream);border-radius:16px;padding:36px;width:100%;max-width:440px;box-shadow:0 24px 64px rgba(0,0,0,.2);}
.login-logo{max-width:160px;display:block;margin:0 auto 24px;}
.login-tabs{display:flex;gap:0;margin-bottom:24px;border-radius:9px;overflow:hidden;border:1.5px solid rgba(121,20,40,.15);}
.ltab{flex:1;padding:9px;text-align:center;font-size:12px;font-weight:600;cursor:pointer;color:var(--crose);background:transparent;border:none;font-family:var(--font-sans);transition:all .15s;}
.ltab.sel{background:var(--cr);color:var(--ccream);}
.perfis-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px;}
.lp{padding:10px 6px;border-radius:9px;border:1.5px solid rgba(121,20,40,.15);text-align:center;cursor:pointer;font-size:11px;font-weight:600;color:var(--crose);transition:all .15s;display:flex;flex-direction:column;align-items:center;gap:4px;}
.lp:hover{border-color:var(--cr);color:var(--cr);}
.lp.sel{border-color:var(--cr);background:rgba(121,20,40,.06);color:var(--cr);}
.lp i{font-size:20px;}
.lerr{color:#c0392b;font-size:12px;margin-top:8px;display:none;}

/* ══ ALUNO APP ══ */
.alu-topbar{background:var(--cd);padding:14px 22px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.alu-brand{font-family:var(--font-serif);color:var(--cp);font-size:16px;}
.alu-user{display:flex;align-items:center;gap:10px;}
.alu-name{font-size:13px;color:var(--cp);font-weight:600;}
.alu-av{width:32px;height:32px;border-radius:50%;background:rgba(247,198,211,.2);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--cp);}
.alu-tabs{display:flex;gap:4px;padding:12px 22px;background:var(--ccard);border-bottom:1px solid rgba(121,20,40,.07);overflow-x:auto;}
.alu-tab{padding:7px 14px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;border:1.5px solid rgba(121,20,40,.15);color:var(--crose);background:transparent;font-family:var(--font-sans);white-space:nowrap;transition:all .15s;}
.alu-tab.active{background:var(--cr);color:var(--ccream);border-color:var(--cr);}
.alu-pc{flex:1;overflow-y:auto;padding:20px 22px;background:var(--cbg);}
.alu-hero{background:linear-gradient(135deg,var(--cd),var(--cr));border-radius:14px;padding:24px;color:var(--ccream);margin-bottom:16px;}
.alu-hero-welcome{font-size:13px;opacity:.8;margin-bottom:4px;}
.alu-hero-name{font-family:var(--font-serif);font-size:28px;margin-bottom:16px;}
.alu-hero-stats{display:flex;gap:20px;flex-wrap:wrap;}
.alu-hero-stat-v{font-size:20px;font-weight:700;}
.alu-hero-stat-l{font-size:10px;opacity:.7;text-transform:uppercase;letter-spacing:.05em;}
.motiv-card{background:linear-gradient(135deg,rgba(247,198,211,.2),rgba(247,198,211,.05));border:1px solid rgba(247,198,211,.3);border-radius:12px;padding:20px;text-align:center;margin-bottom:14px;}
.motiv-emoji{font-size:28px;display:block;margin-bottom:8px;}
.motiv-txt{font-family:var(--font-serif);font-size:16px;color:var(--cd);margin-bottom:4px;}
.motiv-sub{font-size:12px;color:var(--crose);}

/* ══ KANBAN CRM ══ */
.kanban{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;overflow-x:auto;}
.kb-col{background:rgba(121,20,40,.04);border-radius:10px;padding:10px;}
.kb-hdr{font-size:11px;font-weight:700;color:var(--cd);padding:6px 8px;margin-bottom:8px;border-bottom:2px solid var(--cr);}
.kb-card{background:var(--ccard);border-radius:8px;padding:10px;margin-bottom:6px;border:1px solid rgba(121,20,40,.08);cursor:pointer;transition:all .12s;font-size:12px;}
.kb-card:hover{border-color:var(--cr);transform:translateY(-1px);}
.kb-card .kb-nome{font-weight:700;color:var(--cd);margin-bottom:3px;}
.kb-card .kb-info{font-size:10px;color:var(--crose);}

/* ══ LOGIN REDESIGN ══ */
#screen-login{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#461017 0%,#791428 60%,#BC5572 100%);
  position:relative;
  overflow:hidden;
}
#screen-login::before{
  content:'';
  position:absolute;
  width:600px;height:600px;
  background:rgba(247,198,211,.05);
  border-radius:50%;
  top:-200px;right:-200px;
}
#screen-login::after{
  content:'';
  position:absolute;
  width:400px;height:400px;
  background:rgba(247,198,211,.04);
  border-radius:50%;
  bottom:-150px;left:-100px;
}
.login-box{
  background:rgba(253,251,246,.97);
  border-radius:20px;
  padding:40px 36px;
  width:100%;
  max-width:440px;
  box-shadow:0 32px 80px rgba(0,0,0,.3),0 0 0 1px rgba(247,198,211,.2);
  position:relative;
  z-index:1;
  backdrop-filter:blur(10px);
}
.login-logo-wrap{
  text-align:center;
  margin-bottom:28px;
}
.login-logo{
  max-width:200px;
  max-height:100px;
  object-fit:contain;
  display:block;
  margin:0 auto;
}
.login-tagline{
  font-size:12px;
  color:var(--crose);
  text-align:center;
  margin-top:8px;
  letter-spacing:.05em;
}
.login-divider{
  display:flex;
  align-items:center;
  gap:12px;
  margin:20px 0;
}
.login-divider::before,.login-divider::after{
  content:'';flex:1;height:1px;background:rgba(121,20,40,.12);
}
.login-divider span{font-size:11px;color:var(--crose);font-weight:600;text-transform:uppercase;letter-spacing:.08em;}

/* ══ RESPONSIVO / CELULAR (tem que ficar por último, pra vencer as regras de cima) ══ */
@media (max-width:860px){
  .btn-menu-mobile{display:inline-flex!important;align-items:center;justify-content:center;}
  .sb{position:fixed!important;top:0;left:0;height:100%;width:78vw!important;min-width:0!important;max-width:270px;transform:translateX(-100%);transition:transform .25s ease;z-index:999;box-shadow:4px 0 24px rgba(0,0,0,.25);}
  body.sb-open .sb{transform:translateX(0);}
  #sb-backdrop{display:none;position:fixed;inset:0;background:rgba(20,6,9,.45);z-index:998;}
  body.sb-open #sb-backdrop{display:block;}
  .mw{width:100%;}
  .topbar{padding:0 10px;height:50px;}
  .tb-l h1#page-title{font-size:15px;}
  .tb-l .tbs{display:none;}
  .tb-r{flex-wrap:wrap;justify-content:flex-end;gap:6px;}
  .pc{padding:12px 10px;}
  .sg.g2,.sg.g3,.sg.g4,.fgrid,.perfis-grid{grid-template-columns:1fr!important;}
  .kanban{grid-template-columns:repeat(6,200px)!important;}
  .tbl{display:block;overflow-x:auto;white-space:nowrap;max-width:100%;}
  #mo{padding:8px;}
  #mwrap{max-width:100%;}
  #mbody{padding:16px;}
  .login-box{padding:22px;}
  .alu-pc{padding:14px 14px;}
}
/* ══ TEMA HALLOWEEN (liga/desliga pelo botão no menu; sem a classe, o visual é o original) ══ */
body.tema-halloween{
  --cr:#e8590c;--cd:#1c0b2e;--cp:#ffd8a8;--crose:#8a3fc7;--ccream:#fff7ec;
  --cbg:#efe6f7;--ccard:#fffaf2;
}
body.tema-halloween .sb{background:linear-gradient(180deg,#1c0b2e 0%,#2a1245 100%);}
body.tema-halloween .topbar{border-bottom:2px solid #e8590c;}
body.tema-halloween #page-title::before{content:'🎃 ';}
body.tema-halloween .sb-top::after{content:'🦇  👻  🕸️  🦇';display:block;text-align:center;margin-top:10px;font-size:14px;letter-spacing:4px;opacity:.9;}
body.tema-halloween .card,body.tema-halloween .sc{border-color:rgba(138,63,199,.18);}
body.tema-halloween .sc.warn{background:#fff3e6;border-color:rgba(232,89,12,.35);}

function normalizarNome(s){
  return (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();
}

async function carregarDados(){
  if(!sb) return;
  try{
    // Carregar teachers PRIMEIRO para o mapa estar pronto quando mapAluno rodar
    var rTe=await sb.from('teachers').select('*');
    if(rTe.data&&rTe.data.length){
      rTe.data.forEach(function(dbT){
        // Match ignorando acentos e maiúsculas (resolve Nínive vs Nivive vs NINIVE)
        var local=TEACHERS.find(function(t){return normalizarNome(t.nome)===normalizarNome(dbT.nome);});
        if(local){
          _teacherIdMap[local.id]=dbT.id;
          // Sincroniza ativo/saída do banco (permite desativar teacher pela tela e persistir)
          local.ativo=dbT.ativo!==false;
          local.saidaEm=dbT.saida_em||local.saidaEm||null;
          // Sincroniza % de comissão do banco, se já foi definido lá (senão mantém o padrão hardcoded)
          if(dbT.percentual!==undefined&&dbT.percentual!==null) local.percentual=parseFloat(dbT.percentual);
        } else {
          // Teacher criada direto pela tela (não existe no array hardcoded) — adiciona à lista local
          if(!TEACHERS.some(function(t){return t.id===dbT.id;})){
            TEACHERS.push({id:dbT.id,nome:dbT.nome,email:dbT.email||'',ativo:dbT.ativo!==false,saidaEm:dbT.saida_em||null,
              percentual:(dbT.percentual!==undefined&&dbT.percentual!==null)?parseFloat(dbT.percentual):25});
          }
        }
        // Também mapear pelo UUID do banco direto (para alunos que já têm UUID)
        _teacherIdMap[dbT.id]=dbT.id;
      });
      // Qualquer teacher hardcoded que ainda não existe no banco (ex: nova instalação) é semeada
      TEACHERS.forEach(function(t){
        if(!rTe.data.some(function(dbT){return normalizarNome(dbT.nome)===normalizarNome(t.nome);})){
          salvarTeacherDB(t);
        }
      });
      console.log('Teachers mapeadas:', _teacherIdMap);
      console.log('Teachers do banco:', rTe.data.map(function(t){return t.nome;}));
    } else {
      (async function(){
        for(var i=0;i<TEACHERS.length;i++){ await salvarTeacherDB(TEACHERS[i]); }
      })();
    }
    // Carregar equipe (logins da equipe) — permite cadastrar/desativar teacher e staff pela tela
    await carregarEquipeDB();
    // Agora carregar o resto em paralelo
    var [rAl,rLe,rAu,rEx,rRe,rTa]=await Promise.all([
      sb.from('alunos').select('*'),
      sb.from('leads').select('*'),
      sb.from('aulas').select('*'),
      sb.from('extras').select('*'),
      sb.from('reunioes').select('*'),
      sb.from('tarefas').select('*'),
    ]);
    if(rAl.data&&rAl.data.length) ALUNOS=rAl.data.map(mapAluno);
    if(rLe.data&&rLe.data.length) LEADS=rLe.data.map(mapLead);
    if(rAu.data&&rAu.data.length) AULAS=rAu.data.map(mapAula);
    if(rEx.data&&rEx.data.length) EXTRAS=rEx.data.map(mapExtra);
    if(rRe.data&&rRe.data.length) REUNIOES=rRe.data.map(mapReuniao);
    if(rTa.data&&rTa.data.length) TAREFAS=rTa.data.map(mapTarefa);
    // Carregar horários
    try{
      var rHor=await sb.from('horarios').select('*');
      if(rHor.data&&rHor.data.length){
        HORARIOS={};
        rHor.data.forEach(function(r){
          var key=r.id||(r.teacher_id+'_'+r.dia_semana+'_'+r.hora);
          // teacher_id vem como UUID do banco; converter de volta para o id local (t0,t1...)
          // para bater com o restante do app (ex: filtro de alunas no editar horário)
          var localTid=Object.keys(_teacherIdMap).find(function(k){
            return _teacherIdMap[k]===r.teacher_id && k!==r.teacher_id;
          });
          HORARIOS[key]={tipo:r.tipo||'fixo',alunoId:r.aluno_id||'',teacherId:localTid||r.teacher_id||'',obs:r.obs||'',nomeTurma:r.nome_turma||''};
        });
      }
    }catch(e){console.warn('Erro carregar horários:',e);}
    console.log('Dados carregados:',ALUNOS.length,'alunos',TEACHERS.length,'teachers');
    // Carregar despesas e livros
    await carregarDespesasDB();
    await carregarLivrosDB();
    await carregarJogosDB();
    await carregarModulosExtrasDB();
    virarMesFinanceiro();
  }catch(e){ console.warn('Supabase offline:',e); }
}

// Resolve ID de teacher: converte id local (t0,t1) para UUID do banco
var _teacherIdMap={};
async function resolveTeacherId(localId){
  if(!localId) return null;
  // Se ja e um UUID valido, retorna direto
  if(localId && localId.length===36) return localId;
  // Se temos no cache, retorna
  if(_teacherIdMap[localId]) return _teacherIdMap[localId];
  // Buscar pelo nome no banco
  var teacher=TEACHERS.find(function(t){return t.id===localId;});
  if(!teacher) return null;
  var r=await sb.from('teachers').select('id').eq('nome',teacher.nome).single();
  if(r.data){ _teacherIdMap[localId]=r.data.id; return r.data.id; }
  return null;
}
async function salvarTeacherDB(t){
  if(!sb) return null;
  try{
    // Verificar se teacher já existe pelo nome
    var check=await sb.from('teachers').select('id').eq('nome',t.nome).single();
    if(check.data){
      // Já existe, guardar o UUID do banco
      _teacherIdMap[t.id]=check.data.id;
      return check.data.id;
    }
    // Inserir sem ID (banco gera uuid)
    var r=await sb.from('teachers').insert({nome:t.nome,email:t.email||'',ativo:t.ativo!==false,percentual:(t.percentual!==undefined&&t.percentual!==null)?t.percentual:25}).select('id').single();
    if(r.data){ _teacherIdMap[t.id]=r.data.id; console.log('Teacher salva:',t.nome,r.data.id); return r.data.id; }
    if(r.error) console.warn('Erro salvar teacher:', r.error.message);
  }catch(e){ console.warn('Erro salvarTeacherDB:',e); }
  return null;
}

  err.style.display='none';

  if(!senha){err.style.display='block';err.textContent='Digite sua senha.';return;}

  if(!_dadosCarregados){

    garantirDados().then(function(){err.style.display='none';doLogin();})

  var email=(document.getElementById('al-email').value||'').trim().toLowerCase();

  err.style.display='none';
  if(!email){err.style.display='block';err.textContent='Digite seu email.';return;}
  if(!ALUNOS.length){
    err.style.display='block';
    if(doLoginAluno._retry){err.textContent='Não consegui carregar os dados. Confira sua internet e recarregue a página.';doLoginAluno._retry=false;return;}
    err.textContent='⏳ Carregando os dados, um instante...';

// ── REGRAS DE REPASSE À TEACHER ──────────────────────────
// Modelo por %: a teacher recebe um percentual do que cada aluna dela PAGOU no mês
// (Kessia e Alice: 30% · demais teachers: 25%, configurável por teacher).
function getPercentualTeacher(teacherLocalOuUUID){
  var t=TEACHERS.find(function(x){return x.id===teacherLocalOuUUID;});
  if(!t) t=TEACHERS.find(function(x){return (_teacherIdMap[x.id]||x.id)===teacherLocalOuUUID;});
  return (t&&t.percentual!=null)?t.percentual:25;
}

function calcCustoMesTeacher(teacherId, mes, ano){
  var tUUID=_teacherIdMap[teacherId]||teacherId;
  var pct=getPercentualTeacher(teacherId);
  var idsAlunos=ALUNOS.filter(function(a){return a.teacherId===teacherId||a.teacherId===tUUID;})
    .map(function(a){return a.id;});
  var receita=PAGAMENTOS.filter(function(p){
    if(idsAlunos.indexOf(p.alunoId)===-1) return false;
    if(!p.data) return false;
    var d=new Date(p.data);
    return d.getMonth()===mes && d.getFullYear()===ano;
  }).reduce(function(s,p){return s+p.valor;},0);
  return Math.round(receita*pct)/100;
}

  renderRelTab(activeTab);
}

function renderRelTab(tab){
  var rc = document.getElementById('rel-content');
  if(!rc) return;
  if(tab==='fin') renderRelFinanceiro(rc);
  else if(tab==='com') renderRelComercial(rc);
  else if(tab==='exec') renderRelExecutivo(rc);
  else if(tab==='fluxo') renderFluxoCaixa(rc);
  else if(tab==='teachers_custo') renderCustoTeachers(rc);
}


// ── FLUXO DE CAIXA ───────────────────────────────────────
function renderFluxoCaixa(rc){
  var hoje=new Date();
  var mes=hoje.getMonth();
  var ano=hoje.getFullYear();
  var meses=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  var categorias=['Teachers','Marketing','Ferramentas','Impostos','Operacional','Outros'];

  var desp=DESPESAS.filter(function(d){return d.mes===mes&&d.ano===ano;});
  var totalDesp=desp.reduce(function(s,d){return s+d.valor;},0);
  var mrr=ALUNOS.filter(function(a){return a.status==='Ativo'&&isPagante(a);}).reduce(function(s,a){return s+parseFloat(a.valor||0);},0);
  var saldo=mrr-totalDesp;

  // Custo previsão teachers este mês (repasse por % sobre o que as alunas pagaram)
  var custoTeachersPrev=0;
  teachersAtivas().forEach(function(t){
    custoTeachersPrev+=calcCustoMesTeacher(t.id,mes,ano);
  });

    // Seletor de mês
    '<div style="display:flex;align-items:center;gap:12px;margin-bottom:16px">'
    +'<label style="font-size:12px;font-weight:700;color:var(--crose)">Mês:</label>'
    +'<select id="fluxo-mes" style="padding:7px 12px;border-radius:8px;border:1.5px solid rgba(121,20,40,.18);background:#fff;color:var(--cd);font-size:12px">'
    +meses.map(function(m,i){return '<option value="'+i+'"'+(i===mes?' selected':'')+'>'+m+'</option>';}).join('')
    +'</select>'
    +'<select id="fluxo-ano" style="padding:7px 12px;border-radius:8px;border:1.5px solid rgba(121,20,40,.18);background:#fff;color:var(--cd);font-size:12px">'
    +[ano-1,ano,ano+1].map(function(y){return '<option value="'+y+'"'+(y===ano?' selected':'')+'>'+y+'</option>';}).join('')
    +'</select>'
    +'<button class="btn btn-ghost btn-sm" onclick="filtrarFluxo()">Filtrar</button>'
    +'</div>'
    // KPIs
    +'<div class="sg g4" style="margin-bottom:20px">'
    +'<div class="sc ok"><div class="sl">Receita prevista</div><div class="sv">R$ '+mrr.toLocaleString("pt-BR",{minimumFractionDigits:2})+'</div><div style="font-size:11px;color:#666;margin-top:2px">MRR</div></div>'
    +'<div class="sc warn"><div class="sl">Despesas lançadas</div><div class="sv">R$ '+totalDesp.toLocaleString("pt-BR",{minimumFractionDigits:2})+'</div></div>'
    +'<div class="sc warn"><div class="sl">Repasse teachers</div><div class="sv">R$ '+custoTeachersPrev.toLocaleString("pt-BR",{minimumFractionDigits:2})+'</div><div style="font-size:11px;color:#666;margin-top:2px">% sobre o que as alunas pagaram</div></div>'
    +'<div class="sc '+(saldo>=0?'ok':'')+'"><div class="sl">Saldo previsto</div><div class="sv" style="color:'+(saldo>=0?'#16a34a':'#dc2626')+'">R$ '+saldo.toLocaleString("pt-BR",{minimumFractionDigits:2})+'</div></div>'
    +'</div>'
    // Form nova despesa
    +'<div class="card" style="margin-bottom:16px"><div class="ch"><i class="ti ti-plus"></i><h3>Lançar despesa</h3></div>'
    +'<div style="padding:0 16px 16px"><div class="fgrid">'
    +'<div class="fg"><label>Categoria</label><select id="desp-cat">'
    +categorias.map(function(c){return '<option>'+c+'</option>';}).join('')+'</select></div>'
    +'<div class="fg"><label>Descrição</label><input id="desp-desc" placeholder="Ex: Conta Zoom, Anúncios Instagram..."></div>'
    +'<div class="fg"><label>Valor (R$)</label><input type="number" id="desp-valor" placeholder="0,00" step="0.01"></div>'
    +'</div>'
    +'<button class="btn btn-primary" style="margin-top:8px" onclick="lancarDespesa()"><i class="ti ti-plus"></i> Lançar</button>'
    +'</div></div>'
    // Lista despesas
    +'<div class="card"><div class="ch"><i class="ti ti-list"></i><h3>Despesas — '+meses[mes]+' '+ano+'</h3></div>'
    +(desp.length
      ?'<table class="tbl"><tr><th>Categoria</th><th>Descrição</th><th>Valor</th><th></th></tr>'
       +desp.map(function(d){
         return '<tr><td>'+bdg(d.categoria)+'</td><td>'+d.descricao+'</td><td>R$ '+d.valor.toLocaleString("pt-BR",{minimumFractionDigits:2})+'</td>'
           +'<td><button class="btn btn-ghost btn-sm" style="color:var(--crose)" onclick="removerDespesa(\''+d.id+'\')"><i class="ti ti-trash"></i></button></td></tr>';
       }).join('')+'</table>'
      :'<div style="text-align:center;padding:30px;color:var(--crose)">Nenhuma despesa lançada.</div>')

  setTimeout(function(){
    document.getElementById('filtro-fluxo-btn') && document.getElementById('filtro-fluxo-btn').addEventListener('click',filtrarFluxo);

function lancarDespesa(){
  var cat=document.getElementById('desp-cat');
  var desc=document.getElementById('desp-desc');
  var val=document.getElementById('desp-valor');
  if(!desc||!val||!val.value){showToast('Preencha descrição e valor.');return;}
  var hoje=new Date();
  var d={id:uuid(),mes:hoje.getMonth(),ano:hoje.getFullYear(),
    categoria:(cat?cat.value:'Outros'),descricao:desc.value,valor:parseFloat(val.value)||0};
  DESPESAS.push(d);
  salvarDespesasDB();
  showToast('Despesa lançada! ✅');
  renderFluxoCaixa(document.getElementById('rel-content'));
}

function removerDespesa(id){
  if(!confirm('Remover esta despesa?')) return;
  DESPESAS=DESPESAS.filter(function(d){return d.id!==id;});
  if(sb){ try{ sb.from('despesas').delete().eq('id',id); }catch(e){} }
  renderFluxoCaixa(document.getElementById('rel-content'));
}

function filtrarFluxo(){
  var m=parseInt((document.getElementById('fluxo-mes')||{value:new Date().getMonth()}).value);
  var y=parseInt((document.getElementById('fluxo-ano')||{value:new Date().getFullYear()}).value);
  var meses=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  var rc=document.getElementById('rel-content');
  var desp=DESPESAS.filter(function(d){return d.mes===m&&d.ano===y;});
  var totalDesp=desp.reduce(function(s,d){return s+d.valor;},0);
  var mrr=ALUNOS.filter(function(a){return a.status==='Ativo'&&isPagante(a);}).reduce(function(s,a){return s+parseFloat(a.valor||0);},0);
  // Re-render
  renderFluxoCaixa(rc);
}

// ── CUSTO TEACHERS ───────────────────────────────────────
function renderCustoTeachers(rc){
  var hoje=new Date();
  var mes=hoje.getMonth();
  var ano=hoje.getFullYear();
  var meses=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

  var rows=TEACHERS.map(function(t){
    var tid=_teacherIdMap[t.id]||t.id;
    var pct=getPercentualTeacher(t.id);
    var qtdAlunos=ALUNOS.filter(function(a){return a.teacherId===t.id||a.teacherId===tid;}).length;
    var custo=calcCustoMesTeacher(t.id,mes,ano);
    var receita=pct>0?Math.round((custo/(pct/100))*100)/100:0;
    return {nome:t.nome+((t.ativo===false)?' (ex-teacher)':''),ativa:(t.ativo!==false),pct:pct,qtdAlunos:qtdAlunos,receita:receita,custo:custo};
  }).filter(function(r){return r.ativa||r.qtdAlunos>0||r.custo>0;});

  var totalCusto=rows.reduce(function(s,r){return s+r.custo;},0);
  var totalReceita=rows.reduce(function(s,r){return s+r.receita;},0);

  rc.innerHTML=
    '<div class="sg g3" style="margin-bottom:20px">'
    +'<div class="sc warn"><div class="sl">Repasse total às teachers</div><div class="sv">R$ '+totalCusto.toLocaleString("pt-BR",{minimumFractionDigits:2})+'</div><div style="font-size:11px;color:#666;margin-top:2px">'+meses[mes]+' '+ano+'</div></div>'
    +'<div class="sc"><div class="sl">Kessia e Alice</div><div class="sv">30%</div></div>'
    +'<div class="sc"><div class="sl">Demais teachers</div><div class="sv">25%</div></div>'
    +'</div>'
    +'<div class="card"><div class="ch"><i class="ti ti-school"></i><h3>Repasse por teacher — '+meses[mes]+' '+ano+'</h3></div>'
    +'<table class="tbl"><tr><th>Teacher</th><th>Alunos</th><th>%</th><th>Recebido das alunas</th><th style="color:var(--cr)">Repasse R$</th></tr>'
    +rows.map(function(r){
      return '<tr>'
        +'<td class="nm">'+r.nome+'</td>'
        +'<td>'+r.qtdAlunos+'</td>'
        +'<td>'+r.pct+'%</td>'
        +'<td>R$ '+r.receita.toLocaleString("pt-BR",{minimumFractionDigits:2})+'</td>'
        +'<td style="font-weight:700;color:var(--cr)">R$ '+r.custo.toLocaleString("pt-BR",{minimumFractionDigits:2})+'</td>'
        +'</tr>';
    }).join('')
    +'<tr style="background:rgba(121,20,40,.05);font-weight:700"><td colspan="3">Total</td><td>R$ '+totalReceita.toLocaleString("pt-BR",{minimumFractionDigits:2})+'</td><td style="color:var(--cr)">R$ '+totalCusto.toLocaleString("pt-BR",{minimumFractionDigits:2})+'</td></tr>'
    +'</table></div>'
    +'<div class="card" style="margin-top:16px"><div class="ch"><i class="ti ti-info-circle"></i><h3>Regras de pagamento</h3></div>'
    +'<div style="padding:8px 16px 16px;font-size:12px;color:var(--cd);line-height:1.8">'
    +'💰 A teacher recebe um <strong>percentual do que cada aluna dela efetivamente pagou</strong> no mês (não é mais por aula dada).<br>'
    +'✅ <strong>Kessia e Alice</strong> — 30% do valor pago pelas alunas delas<br>'
    +'✅ <strong>Demais teachers</strong> — 25% do valor pago pelas alunas delas<br>'
    +'ℹ️ O % de cada teacher pode ser ajustado no perfil dela, em "Teachers".'
    +'</div></div>';
}

function renderRelFinanceiro(rc){
  destroyCharts();

  // KPIs financeiros
  var totalAtivos = ALUNOS.filter(function(a){return a.status==='Ativo'&&isPagante(a);});

  var recebido = pagos.reduce(function(s,a){return s+parseFloat(a.valor||0);},0);
  var inadimplentes = ALUNOS.filter(function(a){return a.fin==='Atrasado'&&isPagante(a);});
  var emAberto = inadimplentes.reduce(function(s,a){return s+parseFloat(a.valor||0);},0);
  var ticketMedio = totalAtivos.length?Math.round(mrr/totalAtivos.length):0;
  var taxaInad = totalAtivos.length?Math.round(inadimplentes.length/totalAtivos.length*100):0;

    +'<div class="sc ok"><div class="sl">Recebido</div><div class="sv">R$ '+recebido.toLocaleString("pt-BR",{minimumFractionDigits:2})+'</div><div style="font-size:11px;color:#666;margin-top:2px">'+pagos.length+' alunos pagos</div></div>'
    +'<div class="sc warn"><div class="sl">Em aberto</div><div class="sv">R$ '+emAberto.toLocaleString("pt-BR",{minimumFractionDigits:2})+'</div><div style="font-size:11px;color:#666;margin-top:2px">'+inadimplentes.length+' inadimplentes ('+taxaInad+'%)</div></div>'
    +'<div class="sc"><div class="sl">Ticket médio</div><div class="sv">R$ '+ticketMedio.toLocaleString("pt-BR",{minimumFractionDigits:2})+'</div><div style="font-size:11px;color:#666;margin-top:2px">por aluno ativo</div></div>'
    +'</div>'
    // Gráficos
    +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px">'

    +'<div class="card"><div class="ch"><i class="ti ti-table"></i><h3>Detalhamento por vencimento</h3></div>'
    +'<table class="tbl"><tr><th>Vencimento</th><th>Alunos</th><th>Valor total</th><th>Pagos</th><th>Pendentes</th><th>Atrasados</th></tr>'

    +'<div style="padding:8px 16px 16px;display:flex;gap:12px">'
    +(desap?'<div style="background:#fee2e2;border-radius:8px;padding:12px 20px;text-align:center"><div style="font-size:24px;font-weight:700;color:#dc2626">'+desap+'</div><div style="font-size:11px;color:#991b1b">Desaparecidos</div></div>':'')

}

function exportarExcel(){
  var wb = XLSX.utils.book_new();

  // Aba Financeiro
  var finData=[['Nome','Nível','Teacher','Tipo','Plano','Valor (R$)','Vencimento','Status Fin.','Status','Dias Atraso']];
  ALUNOS.forEach(function(a){
    finData.push([a.nome,a.nivel,getTeacher(a.teacherId).nome||'—',a.tipo||'individual',a.plano,a.valor,a.venc,a.fin,a.status,a.diasInadimplente||0]);
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(finData), 'Financeiro');

  // Aba Comercial/Leads
  var comData=[['Nome','Email','Telefone','Origem','Etapa','Nível','Objetivo']];
  LEADS.forEach(function(l){
    comData.push([l.nome,l.email||'',l.tel||'',l.origem||'',l.etapa,l.nivel||'',l.objetivo||'']);
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(comData), 'Leads');

  // Aba Despesas
  var despData=[['Mês','Ano','Categoria','Descrição','Valor (R$)']];
  DESPESAS.forEach(function(d){
    var meses=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
    despData.push([meses[d.mes]||d.mes,d.ano,d.categoria,d.descricao,d.valor]);
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(despData), 'Despesas');

  // Aba Custo Teachers (repasse por %)
  var hoje2=new Date();
  var custoData=[['Teacher','Alunos','% Comissão','Repasse R$']];
  TEACHERS.forEach(function(t){
    var tid=_teacherIdMap[t.id]||t.id;
    var qtdAlunos=ALUNOS.filter(function(a){return a.teacherId===t.id||a.teacherId===tid;}).length;
    var custo=calcCustoMesTeacher(t.id,hoje2.getMonth(),hoje2.getFullYear());
    if(t.ativo===false&&qtdAlunos===0&&custo===0) return;
    custoData.push([t.nome+((t.ativo===false)?' (ex-teacher)':''),qtdAlunos,getPercentualTeacher(t.id)+'%',custo]);
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(custoData), 'Custo Teachers');

  // Aba Resumo
  var ativos=ALUNOS.filter(function(a){return a.status==='Ativo';});
  var mrr=ativos.reduce(function(s,a){return s+parseFloat(a.valor||0);},0);
  var resumo=[
    ['Métrica','Valor'],
    ['Total de alunos',ALUNOS.length],
    ['Alunos ativos',ativos.length],
    ['MRR (R$)',mrr.toFixed(2)],
    ['Inadimplentes',ALUNOS.filter(function(a){return a.fin==='Atrasado'&&isPagante(a);}).length],
    ['Total leads',LEADS.length],
    ['Leads convertidos',LEADS.filter(function(l){return l.etapa==='matriculado';}).length],
  ];
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(resumo), 'Resumo');

  var data=new Date();
  var nome='AmenIna_Relatorio_'+data.getFullYear()+'_'+(data.getMonth()+1).toString().padStart(2,'0')+'.xlsx';
  XLSX.writeFile(wb, nome);
  showToast('Excel exportado! 📊');
}

<script>
// ══════════════════════════════════════════════════════
// HELPERS
// ══════════════════════════════════════════════════════
function inits(nome){return (nome||'').split(' ').slice(0,2).map(function(w){return w[0]||'';}).join('').toUpperCase()||'?';}
function byName(arr){return arr.slice().sort(function(a,b){return a.nome.localeCompare(b.nome,'pt');});}
function isPagante(a){return a.plano!=='Publicidade'&&a.status!=='Cancelado';}
function getTeacher(id){
  if(!id) return {nome:'—'};
  // Buscar por ID local (t0, t1...)
  var byLocal=TEACHERS.find(function(t){return t.id===id;});
  if(byLocal) return byLocal;
  // Buscar pelo UUID do banco via _teacherIdMap
  var localId=Object.keys(_teacherIdMap).find(function(k){return _teacherIdMap[k]===id && k!==id;});
  if(localId) return TEACHERS.find(function(t){return t.id===localId;})||{nome:'—'};
  return {nome:'—'};
}
// Teachers ativas (para selecoes e cadastros). O historico usa TEACHERS completo.
function teachersAtivas(){
  return TEACHERS.filter(function(t){return t.ativo!==false;});
}
// Opcoes de <select>: ativas + a teacher atual do registro (mesmo se inativa),
// para nunca trocar sem querer a teacher de uma aluna ao salvar.
function optsTeachers(selId){
  var lista=teachersAtivas().slice();
  if(selId){
    var atual=TEACHERS.find(function(t){return t.id===selId;});
    if(!atual){
      var lid=Object.keys(_teacherIdMap).find(function(k){return _teacherIdMap[k]===selId&&k!==selId;});
      if(lid) atual=TEACHERS.find(function(t){return t.id===lid;});
    }
    if(atual&&lista.indexOf(atual)===-1) lista.push(atual);
  }
  return lista.sort(function(a,b){return a.nome.localeCompare(b.nome,'pt');})
    .map(function(t){
      var sel=(t.id===selId)?' selected':'';
      var tag=(t.ativo===false)?' (inativa)':'';
      return '<option value="'+t.id+'"'+sel+'>'+t.nome+tag+'</option>';
    }).join('');
}
function myAlunos(){
  if(S.perfil==='teacher'&&S.teacherId){
    // Checar ID local (t0, t1...) E UUID do banco
    var tUUID=_teacherIdMap[S.teacherId]||S.teacherId;
    return byName(ALUNOS.filter(function(a){
      return a.teacherId===S.teacherId||a.teacherId===tUUID;
    }));
  }
  return byName(ALUNOS);
}
// Pausada (pedido ou inadimplência) ou matrícula cancelada — ficam fora da lista principal de Alunos
function statusInativo(status){
  return status==='Pausado'||status==='Pausado-Inadimplencia'||status==='Cancelado';
}
function alunosAtivos(){ return myAlunos().filter(function(a){return !statusInativo(a.status);}); }
function alunosInativas(){ return myAlunos().filter(function(a){return statusInativo(a.status);}); }
function fmtDate(d){return d.toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'2-digit'});}
function fmtDateBr(iso){if(!iso)return '';try{return new Date(iso+'T12:00').toLocaleDateString('pt-BR');}catch(e){return iso;}}
function getWeekDates(){
  var hoje=new Date(),dow=hoje.getDay();
  var mon=new Date(hoje);mon.setDate(hoje.getDate()-(dow===0?6:dow-1));
  return [0,1,2,3,4].map(function(i){var d=new Date(mon);d.setDate(mon.getDate()+i);return d;});
}
// Grade de Horários: recorrente por dia da semana (não por data), pra não precisar recadastrar toda semana.
var DIAS_SEMANA=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
var DIA_PT={Monday:'Segunda',Tuesday:'Terça',Wednesday:'Quarta',Thursday:'Quinta',Friday:'Sexta',Saturday:'Sábado',Sunday:'Domingo'};
function openModal(html){
  document.getElementById('mbody').innerHTML=html;
  document.getElementById('mo').classList.remove('hidden');
}
function closeModal(){document.getElementById('mo').classList.add('hidden');}
document.addEventListener('click',function(e){if(e.target===document.getElementById('mo'))closeModal();});

function showToast(msg){
  var t=document.createElement('div');
  t.style.cssText='position:fixed;bottom:24px;right:24px;background:var(--cd);color:var(--ccream);padding:12px 20px;border-radius:10px;font-size:13px;font-weight:600;z-index:9999;box-shadow:0 8px 24px rgba(70,16,23,.3);animation:fadeIn .2s;';
  t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(function(){t.remove();},3000);
}

var STATUS_LABELS={'Pausado-Inadimplencia':'Pausado (inadimplência)'};
function bdg(val){
  var map={
    'Pago':'ok','Ativo':'ok','Presente':'ok','Ótimo':'ok','concluido':'ok','Em dia':'ok','Montada':'warn','Cancelada':'warn','Remarcada':'warn',
    'Pendente':'warn','Flexível':'warn','andamento':'warn','Reposição':'warn',
    'Pausado':'warn','Pausado-Inadimplencia':'warn','Atenção':'warn',
    'Atrasado':'err','Inativo':'err','Faltou':'err','perdido':'err','bloqueado':'err','Cancelado':'err','Desaparecido':'err',
    'A1':'info','A2':'info','B1':'info','B2':'info','C1':'info','C2':'info',
  };
  var cls=map[val]||'gray';
  return '<span class="badge badge-'+cls+'">'+(STATUS_LABELS[val]||val)+'</span>';
}
// Badge financeiro "inteligente": mostra pagamento efetuado + data, ou escalona
// Em atraso (1-5 dias) -> Inadimplente (6+ dias), sem expor o valor que a aluna paga.
function bdgFin(al){
  if(al.fin==='Pago'){
    var ultimoPg=PAGAMENTOS.filter(function(p){return p.alunoId===al.id;})
      .sort(function(x,y){return (y.data||'').localeCompare(x.data||'');})[0];
    return '<span class="badge badge-ok">Pagamento efetuado</span>'
      +(ultimoPg?'<div style="font-size:10px;color:#2d6a10;margin-top:2px">em '+fmtDateBr(ultimoPg.data)+'</div>':'');
  }
  if(al.fin==='Atrasado'){
    if((al.diasInadimplente||0)>5) return '<span class="badge badge-err">Inadimplente</span>';
    return '<span class="badge badge-warn">Em atraso</span>';
  }
  return bdg(al.fin);
}
function etLbl(e){
  var m={lead:'Lead',contato:'Contato',aula_exp:'Aula Exp.',followup:'Follow-up',matriculado:'Matriculado',perdido:'Perdido'};
  return m[e]||e;
}
var MOTIVS=[
  {emoji:'🌟',txt:'Every lesson is a step forward.',sub:'Você está indo incrível!'},
  {emoji:'✨',txt:'Fluency is closer than you think.',sub:'Continue assim, você consegue!'},
  {emoji:'🎯',txt:'Practice makes perfect.',sub:'Cada aula te deixa mais perto!'},
  {emoji:'💪',txt:"You're braver than you believe.",sub:'Falar inglês é uma super conquista!'},
];
function motiv(){return MOTIVS[Math.floor(Math.random()*MOTIVS.length)];}
function getFeedbackSemana(){var d=new Date().getDay();return d===1||d===4;}

function switchEditTab(tab){
  var tabs=document.getElementById('edit-tabs');
  if(!tabs)return;
  ['dados','ficha','plano'].forEach(function(t){
    var p=document.getElementById('epanel-'+t);
    if(p)p.style.display=(t===tab)?'':'none';
  });
  tabs.querySelectorAll('[data-tab]').forEach(function(t){
    t.style.borderBottomColor=t.dataset.tab===tab?'var(--cr)':'transparent';
    t.style.color=t.dataset.tab===tab?'var(--cr)':'var(--crose)';
  });
}
function uploadFichaEdit(ev){
  var f=ev.target.files&&ev.target.files[0];
  if(!f)return;
  if(f.type!=='application/pdf'){showToast('Apenas PDFs!');return;}
  if(f.size>4*1024*1024){showToast('⚠️ PDF muito grande (máx. 4 MB). Comprima o arquivo e tente de novo.');return;}
  var reader=new FileReader();
  reader.onload=function(e){
    var a=ALUNOS.find(function(x){return x.id===window._editingAlunaId;});
    if(!a)return;
    a.fichaUrl=e.target.result;
    salvarAlunaDB(a);
    showToast('Ficha anexada! 📎');
    openEditAluna(window._editingAlunaId);
    setTimeout(function(){switchEditTab('ficha');},60);
  };
  reader.readAsDataURL(f);
}
function removerFichaEdit(){
  var a=ALUNOS.find(function(x){return x.id===window._editingAlunaId;});
  if(!a)return;
  a.fichaUrl=null;salvarAlunaDB(a);showToast('Ficha removida.');
  openEditAluna(window._editingAlunaId);
  setTimeout(function(){switchEditTab('ficha');},60);
}

    +'<div style="text-align:center;padding:24px">'

      ?'<i class="ti ti-notebook" style="font-size:48px;color:var(--cr);display:block;margin-bottom:10px"></i>'

       +'<div style="font-size:12px;color:var(--crose);margin-bottom:14px">Progresso: '+(al.planoProgresso||[]).length+'/30 dias</div>'
      :'<i class="ti ti-notebook" style="font-size:48px;color:var(--crose);display:block;margin-bottom:10px"></i>'
       +'<div style="font-size:14px;font-weight:600;color:var(--cd);margin-bottom:4px">Nenhum plano</div>'
       +'<div style="font-size:12px;color:var(--crose);margin-bottom:14px">Selecione o HTML do plano de estudos</div>')
    +'<label class="btn btn-primary" style="cursor:pointer;margin:0"><i class="ti ti-upload"></i> Selecionar plano HTML<input type="file" accept=".html,text/html" style="position:absolute;opacity:0;width:1px;height:1px;overflow:hidden;z-index:-1" onchange="uploadPlanoAlunaFile(event,\''+alunaId+'\')"></label>'
    +'</div>';
  openModal(html);
}
function openUploadPlanoGlobal(){
  // Escolher aluna primeiro
  var opts=ALUNOS.slice().sort(function(a,b){return a.nome.localeCompare(b.nome,'pt');})
    .map(function(al){return '<option value="'+al.id+'">'+(al.planoHtml?'✅ ':'')+al.nome+'</option>';}).join('');
  var html='<div class="mhdr"><h2>Carregar plano de estudos</h2><button class="mclose" onclick="closeModal()">✕</button></div>'
    +'<div style="padding:20px"><div class="fg"><label>Selecione a aluna</label><select id="sel-aluna-plano">'+opts+'</select></div>'
    +'<div style="margin-top:14px">'
    +'<label class="btn btn-primary" style="cursor:pointer;margin:0"><i class="ti ti-upload"></i> Selecionar arquivo HTML<input type="file" accept=".html,text/html" style="position:absolute;opacity:0;width:1px;height:1px;overflow:hidden;z-index:-1" onchange="uploadPlanoGlobalFile(event)"></label>'
    +'</div></div>';
  openModal(html);
}
function removerPlanoAluna(alunaId){
  if(!confirm('Remover o plano desta aluna? O progresso também será apagado.')) return;
  var a=ALUNOS.find(function(x){return x.id===alunaId;});
  if(a){a.planoHtml=null;a.planoProgresso=[];salvarAlunaDB(a);showToast('Plano removido.');renderPlanos(document.getElementById('pc'),document.getElementById('tb-actions'));}
}
function renderAlertasPresenca(){
  var desap=ALUNOS.filter(function(a){return a.status==='Desaparecido';});
  var atencao=ALUNOS.filter(function(a){return a.status==='Atenção';});
  if(!desap.length&&!atencao.length) return '';
  var html='<div class="card" style="border:2px solid #ef4444;margin-top:12px"><div class="ch"><i class="ti ti-alert-circle" style="color:#ef4444"></i><h3 style="color:#ef4444">Alertas de Presença</h3></div>';
  if(desap.length){
    html+='<div style="padding:8px 16px;font-size:12px;font-weight:700;color:#ef4444">🚨 Desaparecidos ('+desap.length+')</div>'
      +'<table class="tbl"><tr><th>Aluno</th><th>Faltas</th><th>Teacher</th></tr>'
      +desap.map(function(al){return '<tr style="background:rgba(239,68,68,.05)"><td class="nm" data-alid="'+al.id+'">'+al.nome+'</td><td>'+al.faltas+'</td><td>'+getTeacher(al.teacherId).nome+'</td></tr>';}).join('')+'</table>';
  }
  if(atencao.length){
    html+='<div style="padding:8px 16px;font-size:12px;font-weight:700;color:#f59e0b">⚠️ Merecem Atenção ('+atencao.length+')</div>'
      +'<table class="tbl"><tr><th>Aluno</th><th>Faltas</th><th>Teacher</th></tr>'
      +atencao.map(function(al){return '<tr style="background:rgba(245,158,11,.05)"><td class="nm" data-alid="'+al.id+'">'+al.nome+'</td><td>'+al.faltas+'</td><td>'+getTeacher(al.teacherId).nome+'</td></tr>';}).join('')+'</table>';
  }
  return html+'</div>';
}
// ── Contratos ──
function contratoOpts(sel){
  sel=parseInt(sel)||0;
  return '<option value=""'+(!sel?' selected':'')+'>Manual / não definido</option>'
    +[3,6,12].map(function(m){return '<option value="'+m+'"'+(sel===m?' selected':'')+'>'+m+' meses</option>';}).join('');
}
function contratoAddMeses(iso,n){
  var p=iso.split('-');var y=+p[0],m=+p[1]-1+n,d=+p[2];
  var last=new Date(y,m+1,0).getDate();
  var dt=new Date(y,m,Math.min(d,last));
  return dt.getFullYear()+'-'+('0'+(dt.getMonth()+1)).slice(-2)+'-'+('0'+dt.getDate()).slice(-2);
}
function contratoRecalc(pf){
  var m=parseInt(document.getElementById(pf+'-contrato-meses').value)||0;
  var ini=document.getElementById(pf+'-contrato-inicio').value;
  if(m&&ini) document.getElementById(pf+'-contrato-fim').value=contratoAddMeses(ini,m);
}
function renderLembreteContratos(){
  var mes=hojeISO().slice(0,7), hoje=hojeISO();
  var lista=ALUNOS.filter(function(a){return a.contratoFim&&a.status!=='Cancelado'&&a.status!=='Desaparecido'&&a.contratoFim.slice(0,7)<=mes;})
    .sort(function(a,b){return a.contratoFim.localeCompare(b.contratoFim);});
  if(!lista.length) return '';
  return '<div class="card warn"><div class="ch"><i class="ti ti-file-certificate"></i><h3>📄 Contratos vencendo neste mês ('+lista.length+')</h3></div>'
    +'<table class="tbl"><tr><th>Aluna</th><th>Plano</th><th>Vence em</th><th>Situação</th><th></th></tr>'
    +lista.map(function(al){
      var venceu=al.contratoFim<hoje;
      return '<tr><td class="nm" data-alid="'+al.id+'">'+al.nome+'</td><td>'+al.plano+'</td><td>'+fmtDateBr(al.contratoFim)+'</td>'
        +'<td>'+(venceu?'<span class="badge badge-err">Vencido</span>':'<span class="badge badge-warn">Vence este mês</span>')+'</td>'
        +'<td><button class="btn btn-ghost btn-sm" onclick="renovarContrato(\''+al.id+'\')">🔄 Renovar</button></td></tr>';
    }).join('')+'</table></div>';
}
function renovarContrato(id){
  var al=ALUNOS.find(function(a){return a.id===id;});if(!al) return;
  var m=parseInt(prompt('Renovar por quantos meses? (3, 6 ou 12)','12'));
  if([3,6,12].indexOf(m)<0){showToast('Escolha 3, 6 ou 12.');return;}
  var base=(al.contratoFim&&al.contratoFim>hojeISO())?al.contratoFim:hojeISO();
  al.contratoMeses=m;al.contratoInicio=base;al.contratoFim=contratoAddMeses(base,m);
  salvarAlunaDB(al);
  showToast('Contrato renovado até '+fmtDateBr(al.contratoFim)+' ✅');
  goPage(S.page||'dashboard');
}
function renderDashboard(c,a){

    c.innerHTML=welcome

      +'<div class="sc '+(urgAlta.length?'warn':'ok')+'"><div class="sl">Notas urgentes</div><div class="sv">'+urgAlta.length+'</div></div>'
      +'</div>'
      +renderLembreteContratos()
      +(atrasadas.length?'<div class="card warn"><div class="ch"><i class="ti ti-alert-triangle"></i><h3>⚠️ Inadimplentes</h3></div>'
        +'<table class="tbl"><tr><th>Aluna</th><th>Plano</th><th>Valor</th><th>Vencimento</th></tr>'
        +atrasadas.slice(0,5).map(function(al){return '<tr><td class="nm" data-alid="'+al.id+'">'+al.nome+'</td><td>'+al.plano+'</td><td>R$'+al.valor+'</td><td>Dia '+al.venc+'</td></tr>';}).join('')
        +'</table></div>':'')
      +(notasPend.length?'<div class="card"><div class="ch"><i class="ti ti-notebook"></i><h3>📝 Notas pendentes</h3><button class="cha" onclick="goPage(\'notas\')">Ver todas →</button></div>'
        +notasPend.slice(0,3).map(function(n){
          var urgCor={alta:'rgba(252,228,236,.5)',media:'rgba(255,243,224,.5)',baixa:'rgba(232,245,233,.5)'};
          return '<div style="padding:10px;background:'+(urgCor[n.urgencia]||'#f5f5f5')+';border-radius:9px;margin-bottom:8px">'
            +'<div style="font-size:13px;font-weight:700;color:var(--cd)">'+n.titulo+'</div>'
            +(n.prazo?'<div style="font-size:11px;color:var(--crose)">📅 Prazo: '+n.prazo+'</div>':'')
            +'</div>';}).join('')+'</div>':'')
      +'<div class="sg g3">'
      +'<div class="sc" style="cursor:pointer" data-pg="usuarios" onclick="goPage(this.dataset.pg)"><div class="sl">Atalho</div><div style="font-size:22px;margin:4px 0">👥</div><div style="font-size:12px;color:var(--cd);font-weight:600">Gestão de Usuários</div></div>'
      +'<div class="sc" style="cursor:pointer" data-pg="crm" onclick="goPage(this.dataset.pg)"><div class="sl">Atalho</div><div style="font-size:22px;margin:4px 0">🎯</div><div style="font-size:12px;color:var(--cd);font-weight:600">CRM / Leads</div></div>'
      +'<div class="sc" style="cursor:pointer" data-pg="pagamentos" onclick="goPage(this.dataset.pg)"><div class="sl">Atalho</div><div style="font-size:22px;margin:4px 0">💰</div><div style="font-size:12px;color:var(--cd);font-weight:600">Pagamentos</div></div>'
      +'</div>';
  } else if(S.perfil==='teacher'){
    atualizarDiasInadimplente();
    var meus=alunosAtivos();
    var meusInad=meus.filter(function(a){return a.fin==='Atrasado'&&isPagante(a);});
    c.innerHTML=welcome
      +'<div class="sg g3">'
      +'<div class="sc"><div class="sl">Minhas alunas ativas</div><div class="sv">'+meus.length+'</div></div>'
      +'<div class="sc"><div class="sl">Em risco</div><div class="sv">'+meus.filter(function(a){return a.risco!=='low';}).length+'</div></div>'
      +'<div class="sc"><div class="sl">Aulas hoje</div><div class="sv">'+AULAS.filter(function(r){return r.teacherId===S.teacherId&&r.data===new Date().toISOString().split('T')[0];}).length+'</div></div>'
      +'</div>'
      +(meusInad.length?'<div class="card" style="border:2px solid #ef4444;margin-bottom:14px"><div class="ch"><i class="ti ti-alert-triangle" style="color:#ef4444"></i><h3 style="color:#ef4444">⚠️ Pagamento em atraso</h3></div>'
        +'<table class="tbl"><tr><th>Aluna</th><th>Status</th></tr>'
        +meusInad.map(function(al){return '<tr style="background:rgba(239,68,68,.05)"><td class="nm" data-alid="'+al.id+'">'+al.nome+'</td><td>'+bdgFin(al)+'</td></tr>';}).join('')
        +'</table></div>':'')
      +(meus.length?'<div class="card"><div class="ch"><i class="ti ti-users"></i><h3>Minhas alunas</h3></div>'
        +'<table class="tbl"><tr><th>Nome</th><th>Nível</th><th>Freq.</th><th>Financeiro</th></tr>'
        +meus.map(function(al){return '<tr><td class="nm" data-alid="'+al.id+'">'+al.nome+'</td><td>'+al.nivel+'</td><td>'+al.freq+'%</td><td>'+bdgFin(al)+'</td></tr>';}).join('')
        +'</table></div>':'<div class="card" style="text-align:center;padding:40px;color:var(--crose)">Nenhuma aluna vinculada ainda.</div>');
  } else if(S.perfil==='financeiro'){
    atualizarDiasInadimplente();
    var totalPago=ALUNOS.filter(isPagante).reduce(function(s,a){return s+(a.fin==='Pago'?a.valor:0);},0);
    var totalPrev=ALUNOS.filter(function(a){return a.status!=='Desaparecido'&&isPagante(a);}).reduce(function(s,a){return s+a.valor;},0);
    var inad=ALUNOS.filter(function(a){return a.fin==='Atrasado'&&isPagante(a);});
    var negat=ALUNOS.filter(function(a){return a.fin==='Atrasado'&&isPagante(a)&&(a.diasInadimplente||0)>10;});
    // Mensalidades de hoje (vencimento = dia de hoje)
    var hoje=new Date().getDate();
    var vencHoje=ALUNOS.filter(function(a){return isPagante(a)&&a.venc===hoje&&a.fin!=='Pago'&&a.status!=='Desaparecido';})
      .sort(function(a,b){return a.nome.localeCompare(b.nome,'pt');});
    c.innerHTML=welcome
      +'<div class="sg g4">'
      +'<div class="sc ok"><div class="sl">Recebido</div><div class="sv">R$ '+totalPago.toLocaleString('pt-BR')+'</div></div>'
      +'<div class="sc"><div class="sl">Previsto</div><div class="sv">R$ '+totalPrev.toLocaleString('pt-BR')+'</div></div>'

      +'<div class="sc '+(negat.length?'warn':'')+'" style="cursor:pointer" onclick="goPage(\'negativacao\')"><div class="sl">Para negativar</div><div class="sv">'+negat.length+'</div></div>'

      +(vencHoje.length?'<div class="card"><div class="ch"><i class="ti ti-cash"></i><h3>Vencimentos hoje — Dia '+hoje+'</h3></div>'
        +'<table class="tbl"><tr><th>Aluna</th><th>Valor</th><th>Status</th><th></th></tr>'
        +vencHoje.map(function(al){return '<tr><td class="nm" data-alid="'+al.id+'">'+al.nome+'</td><td>R$ '+al.valor+'</td><td>'+bdgFin(al)+'</td>'
          +'<td><button class="btn btn-ghost btn-sm" data-alid="'+al.id+'" data-fin="Pago" onclick="marcarPgto(this)">✅ Pago</button></td></tr>';}).join('')
        +'</table></div>':'')
      +(inad.length?'<div class="card warn"><div class="ch"><i class="ti ti-alert-triangle"></i><h3>Inadimplentes</h3><button class="cha" onclick="goPage(\'inadimplencia\')">Ver todos →</button></div>'
        +'<table class="tbl"><tr><th>Aluna</th><th>Valor</th><th>Dias</th></tr>'
        +inad.slice(0,5).sort(function(a,b){return (b.diasInadimplente||0)-(a.diasInadimplente||0);}
        ).map(function(al){return '<tr><td class="nm" data-alid="'+al.id+'">'+al.nome+'</td><td>R$ '+al.valor+'</td><td>'+(al.diasInadimplente||0)+'d</td></tr>';}).join('')
        +'</table></div>':'')
      +renderLembreteContratos()
      +renderAlertasPresenca();
  } else {
    c.innerHTML=welcome
      +'<div class="sg g3">'
      +'<div class="sc"><div class="sl">Alunas ativas</div><div class="sv">'+alunosAtivos().length+'</div></div>'
      +'<div class="sc warn"><div class="sl">Inadimplentes</div><div class="sv">'+ALUNOS.filter(function(a){return a.fin==='Atrasado'&&isPagante(a);}).length+'</div></div>'
      +'<div class="sc"><div class="sl">Leads</div><div class="sv">'+LEADS.length+'</div></div>'
      +'</div>'
      +(S.perfil==='comercial'?renderLembreteContratos():'')
      +(S.perfil!=='comercial'?renderAlertasPresenca():'');
  }
}
</script>
<script>
// ══════════════════════════════════════════════════════
// GESTÃO DE USUÁRIOS
// ══════════════════════════════════════════════════════
function renderUsuarios(c,a){
  a.innerHTML='<button class="btn btn-primary btn-sm" onclick="openCadastrarAluna()"><i class="ti ti-user-plus"></i> Nova aluna</button>'
    +'<button class="btn btn-ghost btn-sm" onclick="openModal(mCadastrarEquipe())"><i class="ti ti-plus"></i> Nova equipe</button>';
  // Equipe
  var eqHtml='<div class="card"><div class="ch"><i class="ti ti-users-group"></i><h3>Equipe</h3></div>'
    +'<table class="tbl"><tr><th>Nome</th><th>Função</th><th>Usuário</th><th></th></tr>'
    +EQUIPE.map(function(e){
      return '<tr><td class="nm">'+e.nome+'</td><td>'+bdg(e.roleLabel)+'</td><td style="font-family:monospace;font-size:11px">'+e.usuario+'</td>'
        +'<td><button class="btn btn-ghost btn-sm" data-eid="'+e.id+'" onclick="openEditEquipe(this.dataset.eid)"><i class="ti ti-pencil"></i></button></td></tr>';
    }).join('')+'</table></div>';
  // Alunas
  var alHtml='<div class="card"><div class="ch"><i class="ti ti-users"></i><h3>Alunas ('+ALUNOS.length+')</h3></div>'
    +(ALUNOS.length?'<table class="tbl"><tr><th>Nome</th><th>Email</th><th>Teacher</th><th>Plano</th><th>Status fin.</th><th>Status</th><th></th></tr>'
      +byName(ALUNOS).map(function(al){
        return '<tr><td class="nm" data-alid="'+al.id+'">'+al.nome+'</td><td style="font-size:11px">'+al.email+'</td>'
          +'<td>'+getTeacher(al.teacherId).nome+'</td><td>'+al.plano+'</td>'
          +'<td>'+bdgFin(al)+'</td><td>'+bdg(al.status)+'</td>'
          +'<td style="display:flex;gap:4px">'
          +'<button class="btn btn-ghost btn-sm" data-alid="'+al.id+'" onclick="openEditAluna(this.dataset.alid)"><i class="ti ti-pencil"></i></button>'
          +'<button class="btn btn-ghost btn-sm" data-alid="'+al.id+'" onclick="openEditAluna(this.dataset.alid)"><i class="ti ti-pencil"></i></button>'
          +(S.perfil==='gestao'||S.perfil==='pedagogico'?'<button class="btn btn-ghost btn-sm" onclick="abrirPerfilAlunoCoord(\''+al.id+'\')" title="Ver histórico"><i class="ti ti-eye"></i></button>':'')
          +'<button class="btn btn-ghost btn-sm" style="color:var(--crose)" data-alid="'+al.id+'" onclick="excluirAluna(this.dataset.alid)"><i class="ti ti-trash"></i></button>'
      }).join('')+'</table>'
      :'<div style="text-align:center;padding:30px;color:var(--crose)">Nenhuma aluna cadastrada.</div>')
    +'</div>';
  c.innerHTML=eqHtml+alHtml;
}

async function excluirAluna(id){
  if(!confirm('Excluir esta aluna permanentemente? Esta ação não pode ser desfeita.')) return;
  if(sb){
    var r=await sb.from('alunos').delete().eq('id',id);
    if(r.error){ showToast('Erro ao excluir do banco.'); console.warn(r.error); return; }
  }
  ALUNOS=ALUNOS.filter(function(a){return a.id!==id;});
  showToast('Aluna excluída. ✅');
  renderUsuarios(document.getElementById('pc'),document.getElementById('tb-actions'));
}

// Cadastrar Equipe
function mCadastrarEquipe(){
  return '<div class="mhdr"><h2>Nova equipe</h2><button class="mclose" onclick="closeModal()">✕</button></div>'
    +'<div class="fgrid"><div class="fg"><label>Nome</label><input id="ce-nome" placeholder="Nome completo"></div>'
    +'<div class="fg"><label>Função</label><select id="ce-role">'
    +'<option value="teacher">Teacher</option>'
    +'<option value="comercial">Comercial</option>'
    +'<option value="financeiro">Financeiro</option>'
    +'<option value="pedagogico">Coord. Pedagógica</option>'
    +'</select></div>'
    +'<div class="fg" id="ce-pct-wrap"><label>% de comissão (só teacher)</label><input type="number" id="ce-pct" value="25" min="0" max="100"></div></div>'
    +'<div class="fgrid"><div class="fg"><label>Usuário (login)</label><input id="ce-usuario" placeholder="ex: alice"></div>'
    +'<div class="fg"><label>Senha</label><input type="password" id="ce-senha" placeholder="Senha"></div></div>'
    +'<div class="mftr"><button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>'
    +'<button class="btn btn-primary" onclick="salvarEquipe()">Salvar</button></div>';
}

async function salvarEquipe(){
  var nome=document.getElementById('ce-nome').value.trim();
  var role=document.getElementById('ce-role').value;
  var usuario=document.getElementById('ce-usuario').value.trim().toLowerCase();
  var senha=document.getElementById('ce-senha').value;
  if(!nome||!usuario||!senha){showToast('Preencha todos os campos.');return;}
  if(EQUIPE.some(function(e){return e.usuario===usuario;})){showToast('Já existe um usuário com esse login.');return;}
  var labels={teacher:'Teacher',comercial:'Comercial',financeiro:'Financeiro',pedagogico:'Coord. Pedagógica'};
  var av=inits(nome);
  var newId='e'+Date.now();
  var tid=null;
  if(role==='teacher'){
    tid=uuid(); // UUID próprio — vira o id real da teacher tanto localmente quanto no Supabase
    var pctEl=document.getElementById('ce-pct');
    var pctNova=pctEl?(parseFloat(pctEl.value)||25):25;
    var novaTeacher={id:tid,nome:nome,email:usuario+'@amenina.com',ativo:true,percentual:pctNova};
    TEACHERS.push(novaTeacher);
    await sb.from('teachers').upsert({id:tid,nome:nome,email:usuario+'@amenina.com',ativo:true,percentual:pctNova});
    _teacherIdMap[tid]=tid;
  }
  var novoMembro={id:newId,nome:nome,role:role,roleLabel:labels[role],usuario:usuario,senha:senha,avatar:av,teacherId:tid,duploPerfil:false};
  EQUIPE.push(novoMembro);
  await salvarEquipeDB(novoMembro);
  closeModal();showToast('Membro adicionado! ✅');
  renderUsuarios(document.getElementById('pc'),document.getElementById('tb-actions'));
}

function openEditEquipe(id){
  var eq=EQUIPE.find(function(e){return e.id===id;});
  if(!eq) return;
  window._editEquipeId=id;
  var podeDesativar=eq.id!=='e1'&&eq.id!=='e2'; // protege as contas principais (Lawanda/Kessia) de remoção acidental
  openModal('<div class="mhdr"><h2>Editar — '+eq.nome+'</h2><button class="mclose" onclick="closeModal()">✕</button></div>'
    +'<div class="fgrid"><div class="fg"><label>Usuário</label><input id="ee-usuario" value="'+eq.usuario+'"></div>'
    +'<div class="fg"><label>Nova senha (vazio = manter)</label><input type="password" id="ee-senha" placeholder="Nova senha"></div></div>'
    +'<div class="mftr">'
    +(podeDesativar?'<button class="btn btn-ghost" style="color:var(--crose)" onclick="removerEquipe(\''+eq.id+'\')"><i class="ti ti-user-off"></i> Desativar</button>':'')
    +'<button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>'
    +'<button class="btn btn-primary" onclick="salvarEditEquipe()">Salvar</button></div>');
}

async function salvarEditEquipe(){
  var eq=EQUIPE.find(function(e){return e.id===window._editEquipeId;});
  if(!eq) return;
  var usuario=document.getElementById('ee-usuario').value.trim().toLowerCase();
  var senha=document.getElementById('ee-senha').value;
  if(usuario) eq.usuario=usuario;
  if(senha) eq.senha=senha;
  await salvarEquipeDB(eq);
  closeModal();showToast('Dados atualizados! ✅');
  renderUsuarios(document.getElementById('pc'),document.getElementById('tb-actions'));
}

// Desativa o acesso de um membro da equipe. Se for teacher, a teacher fica inativa
// (histórico de aulas preservado) mas o login é removido para ela não conseguir mais entrar.
async function removerEquipe(id){
  var eq=EQUIPE.find(function(e){return e.id===id;});
  if(!eq) return;
  if(!confirm('Desativar o acesso de '+eq.nome+'? '+(eq.teacherId?'As aulas já registradas continuam salvas no histórico.':'')+' Esta ação pode ser revertida cadastrando de novo.')) return;
  if(eq.teacherId){
    var t=TEACHERS.find(function(x){return x.id===eq.teacherId;});
    if(t){ t.ativo=false; t.saidaEm=hojeISO().slice(0,7); }
    await atualizarAtivoTeacherDB(eq.teacherId,false,hojeISO().slice(0,7));
  }
  EQUIPE=EQUIPE.filter(function(e){return e.id!==id;});
  await excluirEquipeDB(id);
  closeModal();showToast('Acesso desativado.');
  renderUsuarios(document.getElementById('pc'),document.getElementById('tb-actions'));
}

  var tipo=(document.getElementById('ca-tipo')||{value:'individual'}).value;

  var valor=calcularValor(tipo,aulas);
  var vEl=document.getElementById('ca-valor');
  var vfEl=document.getElementById('ca-valor-final');
  if(vEl) vEl.value=valor;
  if(vfEl) vfEl.value=valor;
  var dEl=document.getElementById('ca-desconto');
  if(dEl) dEl.value='';
}
function atualizarValorComDesconto(){
  var vEl=document.getElementById('ca-valor');
  var dEl=document.getElementById('ca-desconto');
  var vfEl=document.getElementById('ca-valor-final');
  if(!vEl||!dEl||!vfEl) return;
  var valorCheio=parseFloat(vEl.value)||0;
  var desconto=parseFloat(dEl.value)||0;
  desconto=Math.min(Math.max(desconto,0),100);
  var valorFinal=Math.round(valorCheio*(1-desconto/100));
  vfEl.value=valorFinal;
}

function renderGradeDisp(teacherId,div,aulasSemana){
  var horas=[];for(var h=7;h<=23;h++) horas.push(String(h).padStart(2,'0')+':00');
  var diasNomes=['Seg','Ter','Qua','Qui','Sex'];
  var dias=['Monday','Tuesday','Wednesday','Thursday','Friday'];
  var tipoSel=(document.getElementById('ca-tipo')||{value:'individual'}).value;
  var compart=tipoCompartilha(tipoSel);
  var ocupados={},bloqueados={};
  Object.keys(HORARIOS).forEach(function(k){
    var sl=HORARIOS[k];
    if(sl.teacherId===teacherId){
      var p=k.split('_');var kk=p[1]+'_'+p[2];
      if(sl.tipo==='bloqueado') bloqueados[kk]=true;
      else if(sl.alunoId) ocupados[kk]=slotAlunoIds(sl).length;
    }
  });
  var info='<div style="font-size:10px;color:var(--cr);font-weight:600;margin-bottom:6px">Clique para selecionar '+aulasSemana+' horário'+(aulasSemana>1?'s':'')+' ('+_horariosSelec.length+'/'+aulasSemana+')</div>';
  if(compart) info+='<div style="font-size:10px;color:#7a5200;background:rgba(255,193,7,.15);border-radius:6px;padding:4px 6px;margin-bottom:6px">Tipo '+tipoSel.toUpperCase()+': os quadradinhos amarelos já têm aluna, mas podem receber mais uma no mesmo horário.</div>';
  var tbl='<div style="overflow-x:auto"><table style="border-collapse:collapse;font-size:9px;width:100%">';
  tbl+='<tr><th style="padding:2px 3px;background:var(--cd);color:var(--ccream);border:1px solid rgba(247,198,211,.1);width:32px">H</th>';
  diasNomes.forEach(function(n,i){tbl+='<th style="padding:2px 3px;background:var(--cd);color:var(--ccream);border:1px solid rgba(247,198,211,.1)">'+n+'</th>';});
  tbl+='</tr>';
  horas.forEach(function(hora){
    tbl+='<tr><td style="padding:2px 3px;background:var(--cd);color:var(--cp);font-size:8px;text-align:center;font-weight:700;border:1px solid rgba(247,198,211,.1)">'+hora+'</td>';
    dias.forEach(function(dia){
      var key=dia+'_'+hora;
      var qtd=ocupados[key]||0;
      var ocp=bloqueados[key]||(qtd>0&&!compart);
      var selKey=teacherId+'_'+dia+'_'+hora;
      var sel=_horariosSelec.indexOf(selKey)!==-1;
      if(ocp){
        tbl+='<td style="padding:1px;border:1px solid rgba(121,20,40,.07);text-align:center;background:rgba(121,20,40,.06)"><span style="font-size:8px;color:#aaa">✗</span></td>';
      } else if(qtd>0){
        tbl+='<td style="padding:1px;border:1px solid rgba(121,20,40,.07);text-align:center;cursor:pointer;background:'+(sel?'rgba(45,106,16,.3)':'rgba(255,193,7,.22)')+'" data-hk="'+selKey+'" data-dia="'+dia+'" data-hora="'+hora+'" title="Já tem '+qtd+' aluna(s) neste horário"><span style="font-size:8px;color:#7a5200;pointer-events:none;font-weight:700">'+(sel?'✓':'+'+qtd)+'</span></td>';
      } else {
        tbl+='<td style="padding:1px;border:1px solid rgba(121,20,40,.07);text-align:center;cursor:pointer;background:'+(sel?'rgba(45,106,16,.3)':'rgba(45,106,16,.05)')+'" data-hk="'+selKey+'" data-dia="'+dia+'" data-hora="'+hora+'"><span style="font-size:8px;color:#2d6a10;pointer-events:none">'+(sel?'✓':hora)+'</span></td>';
      }
    });
    tbl+='</tr>';
  });
  tbl+='</table></div>';
  div.innerHTML=info+tbl;
  div.querySelectorAll('[data-hk]').forEach(function(el){
    el.addEventListener('click',function(){
      var hk=this.dataset.hk;
      var idx=_horariosSelec.indexOf(hk);
      if(idx!==-1){ _horariosSelec.splice(idx,1); }
      else{
        var max=parseInt((document.getElementById('ca-aulas-semana')||{value:'1'}).value)||1;
        if(_horariosSelec.length>=max){showToast('Máximo '+max+' horário'+(max>1?'s':'')+'!');return;}
        _horariosSelec.push(hk);
      }
      renderGradeDisp(teacherId,div,parseInt((document.getElementById('ca-aulas-semana')||{value:'1'}).value)||1);
    });
  });
}

function salvarAluna(){
  var nome=(document.getElementById('ca-nome').value||'').trim();
  var email=(document.getElementById('ca-email').value||'').trim();
  var senha=document.getElementById('ca-senha').value;
  if(!nome){showToast('Preencha o nome.');return;}
  if(!email){showToast('Preencha o email.');return;}
  if(!senha){showToast('Crie uma senha para a aluna.');return;}
  if(ALUNOS.find(function(a){return a.email.toLowerCase()===email.toLowerCase();})){showToast('Email já cadastrado.');return;}
  var tid=document.getElementById('ca-teacher').value;
  var tipo=(document.getElementById('ca-tipo')||{value:'individual'}).value;
  var valorCheio=parseFloat(document.getElementById('ca-valor').value)||0;
  var desconto=parseFloat((document.getElementById('ca-desconto')||{value:'0'}).value)||0;
  var valor=parseFloat((document.getElementById('ca-valor-final')||{value:String(valorCheio)}).value)||valorCheio;
  var ddiEl=document.getElementById('ca-ddi');
  var newId=uuid();
  var aulasSemana=parseInt((document.getElementById('ca-aulas-semana')||{value:'1'}).value)||1;
  var newAl={id:newId,nome:nome,email:email,ddi:ddiEl?ddiEl.value:'+55',
    tel:(document.getElementById('ca-tel').value||''),senha:senha,
    sexo:(document.getElementById('ca-sexo')||{value:''}).value,
    cpf:(document.getElementById('ca-cpf')||{value:''}).value.trim(),
    endereco:(document.getElementById('ca-endereco')||{value:''}).value.trim(),
    nivel:document.getElementById('ca-nivel').value,teacherId:tid,
    tipo:tipo,aulasSemana:aulasSemana,plano:document.getElementById('ca-plano').value,valor:valor,valorCheio:valorCheio,desconto:desconto,
    venc:parseInt(document.getElementById('ca-venc').value),
    fin:document.getElementById('ca-fin').value,status:'Ativo',
    contratoMeses:parseInt((document.getElementById('ca-contrato-meses')||{value:''}).value)||0,
    contratoInicio:(document.getElementById('ca-contrato-inicio')||{value:''}).value||'',
    contratoFim:(document.getElementById('ca-contrato-fim')||{value:''}).value||'',
    faltas:0,freq:100,risco:'low',matricula:new Date().toLocaleDateString('pt-BR'),
    nfEmitida:false,fichaUrl:null,planoHtml:null,planoProgresso:[],comentarios:[]};
  ALUNOS.push(newAl);
  // Registrar horários selecionados
  if(_horariosSelec.length>0){
    _horariosSelec.forEach(function(hk){
      var p1=hk.indexOf('_');var p2=hk.indexOf('_',p1+1);
      var tId=hk.slice(0,p1);var dia=hk.slice(p1+1,p2);var hora=hk.slice(p2+1);
      var kSlot=tId+'_'+dia+'_'+hora;
      var ex=HORARIOS[kSlot];
      if(ex&&ex.tipo!=='bloqueado'&&slotAlunoIds(ex).length>0&&tipoCompartilha(tipo)){
        var ids=slotAlunoIds(ex);
        if(ids.indexOf(newId)===-1) ids.push(newId);
        ex.alunoId=ids.join(',');
        if(!ex.teacherId) ex.teacherId=tId;
      } else {
        HORARIOS[kSlot]={tipo:'fixo',alunoId:newId,teacherId:tId,obs:''};
      }
    });
    _horariosSelec=[];
  }
  // Salvar horários no Supabase
  Object.keys(HORARIOS).forEach(function(k){
    var sl=HORARIOS[k];
    if(slotTemAluno(sl,newId)) salvarHorarioDB(k,sl);
  });
  // Se dupla, criar 2º aluno com valor dividido
  if(tipo==='dupla'){

function salvarEditAluna(){
  var al=ALUNOS.find(function(a){return a.id===window._editingAlunaId;});
  if(!al) return;
  var g=function(id){return document.getElementById(id);};
  if(g('ea-nome')&&g('ea-nome').value.trim()) al.nome=g('ea-nome').value.trim();
  if(g('ea-email')&&g('ea-email').value.trim()) al.email=g('ea-email').value.trim();
  if(g('ea-tel')) al.tel=g('ea-tel').value;
  if(g('ea-sexo')) al.sexo=g('ea-sexo').value;
  if(g('ea-senha')&&g('ea-senha').value.trim()) al.senha=g('ea-senha').value.trim();
  if(g('ea-nivel')) al.nivel=g('ea-nivel').value;
  if(g('ea-teacher')) al.teacherId=g('ea-teacher').value;
  if(g('ea-aulas')) al.aulasSemana=parseInt(g('ea-aulas').value)||al.aulasSemana;
  if(g('ea-status')) al.status=g('ea-status').value;
  if(g('ea-aviso-cancel')) al.avisoCancelamento=g('ea-aviso-cancel').checked;
  if(g('ea-aviso-data')) al.avisoCancelamentoData=g('ea-aviso-data').value||null;
  if(g('ea-plano')) al.plano=g('ea-plano').value;
  if(g('ea-pais')) al.pais=g('ea-pais').value;
  if(g('ea-endereco')) al.endereco=g('ea-endereco').value;
  if(g('ea-cidade')) al.cidade=g('ea-cidade').value;
  if(g('ea-estado')) al.estado=g('ea-estado').value;
  if(g('ea-cep')) al.cep=g('ea-cep').value;
  if(g('ea-valor')){
    var novoValor=parseInt(g('ea-valor').value)||al.valor;
    if(novoValor!==al.valor) al.valorManual=true; // edição manual passa a "travar" o valor contra o reajuste automático de desconto/atraso
    al.valor=novoValor;
  }
  if(g('ea-valor-destravar')&&g('ea-valor-destravar').checked) al.valorManual=false;
  if(g('ea-cpf')) al.cpf=g('ea-cpf').value.trim();
  if(g('ea-contrato-fim')){
    al.contratoMeses=parseInt(g('ea-contrato-meses').value)||0;
    al.contratoInicio=g('ea-contrato-inicio').value||'';
    al.contratoFim=g('ea-contrato-fim').value||'';
  }
  if(g('ea-venc')) al.venc=parseInt(g('ea-venc').value)||al.venc;
  if(g('ea-fin')){
    var finAnt=al.fin;
    al.fin=g('ea-fin').value;
    if(al.fin==='Pago'&&finAnt!=='Pago')registrarPagamento(al);
    if(al.fin!=='Pago'&&finAnt==='Pago')estornarPagamentoHoje(al.id);
  }
  salvarAlunaDB(al);
  closeModal();showToast('Dados atualizados! ✅');
  if(S.page==='ficha-aluna'&&window._fichaAlunaId){abrirFichaAluna(window._fichaAlunaId);}
  else{renderUsuarios(document.getElementById('pc'),document.getElementById('tb-actions'));}
}

// Ativa a cobrança automática (Pix/boleto/cartão recorrente) da aluna via Asaas.
// Chama a Edge Function do Supabase, que cria o cliente + assinatura no Asaas
// e salva o link de pagamento. O status "Pago" depois passa a ser atualizado sozinho
// via webhook, sem precisar clicar em nada aqui dentro.
async function ativarCobrancaAsaas(alunoId){
  var btn=document.getElementById('btn-ativar-asaas');
  if(btn){ btn.disabled=true; btn.innerHTML='<i class="ti ti-loader-2"></i> Ativando...'; }
  try{
    var r=await fetch(SB_URL+'/functions/v1/ativar-cobranca-asaas',{
      method:'POST',
      headers:{'Content-Type':'application/json',apikey:SB_KEY,Authorization:'Bearer '+SB_KEY},
      body:JSON.stringify({alunoId:alunoId})
    });
    var data=await r.json();
    if(!r.ok||data.error){ showToast('⚠️ '+(data.error||'Erro ao ativar cobrança automática.')); if(btn){btn.disabled=false;btn.innerHTML='<i class="ti ti-credit-card"></i> Ativar cobrança automática';} return; }
    var al=ALUNOS.find(function(a){return a.id===alunoId;});
    if(al){ al.cobrancaAutomatica=true; al.asaasLink=data.link||null; }
    showToast('Cobrança automática ativada! ✅');
    openEditAluna(alunoId);
  }catch(e){
    showToast('⚠️ Erro ao ativar cobrança automática: '+(e&&e.message?e.message:e));
    if(btn){ btn.disabled=false; btn.innerHTML='<i class="ti ti-credit-card"></i> Ativar cobrança automática'; }
  }
}

      el.addEventListener('click',function(){openEditSlot(this.dataset.slotkey);});
    });

function openAddSlot(dia,hora){
  var teacherAtual=TEACHERS.find(function(t){return t.id===_horarioTeacherId;})||teachersAtivas()[0];

    +'<div class="fg"><label>Nome da turma <span style="font-weight:400;color:var(--crose)">(opcional — aparece no lugar dos nomes quando preenchido)</span></label><input id="hs-nome-turma" placeholder="Ex: Turma PEG, Turma Quinta 20h..."></div>'
    +'<div class="fg"><label>Observações</label><input id="hs-obs" placeholder="Obs..."></div>'
    +'<div class="mftr"><button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>'
    +'<button class="btn btn-primary" onclick="salvarSlot()">Salvar</button></div>');
