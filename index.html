function openEditSlot(key){
  var sl=HORARIOS[key];if(!sl) return;
  window._editSlotKey=key;
  var p=key.split('_');
  var tipo=sl.tipo||'fixo';
  var alunosDaTeacher=byName(ALUNOS.filter(function(a){return a.teacherId===sl.teacherId||!sl.teacherId;}));
  openModal('<div class="mhdr"><h2>Editar horário</h2><button class="mclose" onclick="closeModal()">✕</button></div>'
    +'<div style="font-size:12px;color:var(--crose);margin-bottom:12px">'+(DIA_PT[p[1]]||p[1])+' às '+p[2]+'</div>'
    +'<div class="fgrid"><div class="fg"><label>Tipo</label><select id="hs-tipo"><option value="fixo"'+(tipo==='fixo'?' selected':'')+'>Fixo</option><option value="flexivel"'+(tipo==='flexivel'?' selected':'')+'>Flexível</option><option value="reposicao"'+(tipo==='reposicao'?' selected':'')+'>Reposição</option><option value="bloqueado"'+(tipo==='bloqueado'?' selected':'')+'>Bloqueado</option></select></div>'
    +'<div class="fg"><label>Alunas <span style="font-weight:400;color:var(--crose)">(marque quantas quiser — é turma quando marca mais de uma)</span></label>'
    +'<div id="hs-aluno-list" style="max-height:180px;overflow-y:auto;border:1.5px solid rgba(121,20,40,.15);border-radius:8px;padding:8px 10px">'
    +(alunosDaTeacher.length?alunosDaTeacher.map(function(al){
      return '<label style="display:flex;align-items:center;gap:8px;padding:4px 0;font-size:13px;cursor:pointer;margin:0">'
        +'<input type="checkbox" class="hs-aluno-chk" value="'+al.id+'"'+(slotTemAluno(sl,al.id)?' checked':'')+' style="width:15px;height:15px;flex-shrink:0"> '+al.nome+'</label>';
    }).join(''):'<div style="font-size:12px;color:var(--crose)">Nenhuma aluna atribuída a essa teacher ainda.</div>')
    +'</div></div></div>'
    +'<div class="fg"><label>Nome da turma <span style="font-weight:400;color:var(--crose)">(opcional — aparece no lugar dos nomes quando preenchido)</span></label><input id="hs-nome-turma" value="'+(sl.nomeTurma||'')+'" placeholder="Ex: Turma PEG, Turma Quinta 20h..."></div>'
    +'<div class="fg"><label>Observações</label><input id="hs-obs" value="'+(sl.obs||'')+'"></div>'
    +'<div class="mftr"><button class="btn btn-ghost" style="color:var(--crose)" onclick="excluirSlot()"><i class="ti ti-trash"></i> Excluir</button>'
    +'<button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>'
    +'<button class="btn btn-primary" onclick="atualizarSlot()">Salvar</button></div>');
}

function lerAlunasSlot(){
  var boxes=document.querySelectorAll('.hs-aluno-chk');
  return Array.prototype.slice.call(boxes).filter(function(b){return b.checked;})
    .map(function(b){return b.value;}).join(',');
}
function salvarSlot(){
  var data=document.getElementById('hs-dia').value;
  var hora=document.getElementById('hs-hora').value;
  if(!data){showToast('Selecione o dia da semana.');return;}
  var key=(_horarioTeacherId||'')+'_'+data+'_'+hora;
  var newSlot={tipo:document.getElementById('hs-tipo').value,
    alunoId:lerAlunasSlot(),
    teacherId:_horarioTeacherId||'',
    obs:document.getElementById('hs-obs').value,
    nomeTurma:(document.getElementById('hs-nome-turma')||{value:''}).value.trim()};
  HORARIOS[key]=newSlot;
  salvarHorarioDB(key,newSlot);
  closeModal();showToast('Horário salvo! ✅');
  renderHorarios(document.getElementById('pc'),document.getElementById('tb-actions'));
}

function atualizarSlot(){
  var key=window._editSlotKey;
  if(!key||!HORARIOS[key]) return;
  HORARIOS[key].tipo=document.getElementById('hs-tipo').value;
  HORARIOS[key].alunoId=lerAlunasSlot();
  HORARIOS[key].obs=document.getElementById('hs-obs').value;
  HORARIOS[key].nomeTurma=(document.getElementById('hs-nome-turma')||{value:''}).value.trim();
  salvarHorarioDB(key,HORARIOS[key]);
  closeModal();showToast('Horário atualizado! ✅');
  renderHorarios(document.getElementById('pc'),document.getElementById('tb-actions'));
}

function excluirSlot(){
  if(!confirm('Excluir este horário?')) return;
  excluirHoriarioDB(window._editSlotKey);
  delete HORARIOS[window._editSlotKey];
  closeModal();showToast('Horário excluído.');
  renderHorarios(document.getElementById('pc'),document.getElementById('tb-actions'));
}
</script>
<script>
// ══════════════════════════════════════════════════════
// CRM / LEADS
// ══════════════════════════════════════════════════════
function renderCRM(c,a){
  a.innerHTML='<button class="btn btn-primary btn-sm" onclick="openModal(mNovoLead())"><i class="ti ti-plus"></i> Novo lead</button>';
  var etapas=ETAPAS;
  var kanban='<div class="kanban">';
  etapas.forEach(function(et){
    var leads=LEADS.filter(function(l){return l.etapa===et;});
    kanban+='<div class="kb-col"><div class="kb-hdr">'+etLbl(et)+' ('+leads.length+')</div>';
    leads.forEach(function(l){
      kanban+='<div class="kb-card" data-lid="'+l.id+'"><div class="kb-nome">'+l.nome+'</div>'
        +'<div class="kb-info">'+(l.email||'')+'</div>'
        +'<div class="kb-info" style="margin-top:4px">'+(l.origem?'📍 '+l.origem:'')+'</div></div>';
    });
    kanban+='</div>';
  });
  kanban+='</div>';
  c.innerHTML=kanban;
  c.querySelectorAll('.kb-card[data-lid]').forEach(function(el){
    el.addEventListener('click',function(){openLead(this.dataset.lid);});
  });
}

function mNovoLead(){
  return '<div class="mhdr"><h2>Novo lead</h2><button class="mclose" onclick="closeModal()">✕</button></div>'
    +'<div class="fgrid"><div class="fg"><label>Nome</label><input id="nl-nome" placeholder="Nome completo"></div>'

    +'<input id="nl-tel" placeholder="Número" style="flex:1"></div></div>'
    +'<div class="fg"><label>Origem</label><select id="nl-origem"><option value="Instagram">Instagram</option><option value="WhatsApp">WhatsApp</option><option value="Indicação">Indicação</option><option value="Google">Google</option><option value="Outro">Outro</option></select></div></div>'
    +'<div class="fgrid"><div class="fg"><label>Nível de inglês</label><select id="nl-nivel"><option value="">Não informado</option><option value="A1">A1</option><option value="A2">A2</option><option value="B1">B1</option><option value="B2">B2</option></select></div>'
    +'<div class="fg"><label>Objetivo</label><input id="nl-obj" placeholder="Ex: viagem, trabalho..."></div></div>'
    +'<div class="fg"><label>Observações</label><input id="nl-obs" placeholder="Obs..."></div>'
    +'<div class="mftr"><button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>'
    +'<button class="btn btn-primary" onclick="salvarLead()">Salvar lead</button></div>';
}

function salvarLead(){
  var nome=(document.getElementById('nl-nome').value||'').trim();
  if(!nome){showToast('Preencha o nome.');return;}
  var newLead={id:uuid(),nome:nome,email:document.getElementById('nl-email').value||'',
    ddi:document.getElementById('nl-ddi').value,tel:document.getElementById('nl-tel').value||'',
    origem:document.getElementById('nl-origem').value,nivel:document.getElementById('nl-nivel').value,
    objetivo:document.getElementById('nl-obj').value||'',obs:document.getElementById('nl-obs').value||'',
    etapa:'lead',data:new Date().toISOString().split('T')[0]};
  LEADS.push(newLead);
  salvarLeadDB(newLead);
  closeModal();showToast('Lead adicionado! ✅');
  renderCRM(document.getElementById('pc'),document.getElementById('tb-actions'));
}

function openLead(id){
  window._leadId=id;
  var l=LEADS.find(function(x){return x.id===id;});
  if(!l) return;
  openModal('<div class="mhdr"><h2>'+l.nome+'</h2><button class="mclose" onclick="closeModal()">✕</button></div>'
    +bdg(etLbl(l.etapa))+'<br><br>'
    +'<div class="fst">Dados</div>'
    +'<div class="fgrid"><div class="fg"><label>Email</label><input readonly value="'+(l.email||'')+'"></div>'
    +'<div class="fg"><label>WhatsApp</label><input readonly value="'+(l.ddi||'+55')+' '+(l.tel||'')+'"></div></div>'
    +'<div class="fgrid"><div class="fg"><label>Origem</label><input readonly value="'+(l.origem||'')+'"></div>'
    +'<div class="fg"><label>Objetivo</label><input readonly value="'+(l.objetivo||'')+'"></div></div>'
    +'<div class="fst">Mover etapa</div>'
    +'<div class="fg"><label>Etapa</label><select id="et-lead">'
    +ETAPAS.map(function(e){return '<option value="'+e+'"'+(e===l.etapa?' selected':'')+'>'+etLbl(e)+'</option>';}).join('')
    +'</select></div>'
    +(l.etapa!=='matriculado'?'<div style="background:rgba(45,106,16,.07);border:1px solid rgba(45,106,16,.2);border-radius:9px;padding:12px;font-size:12px;color:#2d6a10;margin:12px 0">💡 Mova para "Matriculado" e crie o perfil automaticamente!</div>':'')
    +'<div class="mftr">'
    +'<button class="btn btn-ghost btn-sm" style="color:var(--crose)" id="btn-del-lead"><i class="ti ti-trash"></i></button>'
    +'<div style="flex:1"></div>'
    +(l.etapa!=='matriculado'?'<button class="btn btn-success" id="btn-matricular-lead">✅ Matricular e criar perfil</button>':'')
    +'<button class="btn btn-primary" id="btn-mover-etapa">Salvar etapa</button></div>');
  setTimeout(function(){
    var bm=document.getElementById('btn-matricular-lead');
    if(bm) bm.addEventListener('click',function(){matricularLead(window._leadId);});
    var bs=document.getElementById('btn-mover-etapa');
    if(bs) bs.addEventListener('click',function(){moverEtapa(window._leadId);});
    var bd=document.getElementById('btn-del-lead');
    if(bd) bd.addEventListener('click',async function(){
      if(confirm('Excluir este lead?')){
        var idParaDeletar=window._leadId;
        // Excluir do Supabase PRIMEIRO, aguardar confirmação
        if(sb){
          try{
            var result=await sb.from('leads').delete().eq('id',idParaDeletar);
            if(result.error){
              console.warn('Erro ao excluir lead do Supabase:',result.error);
              showToast('Erro ao excluir. Verifique o Supabase (RLS).');
              return;
            }
            // Verificar se realmente deletou (RLS pode bloquear silenciosamente)
            var check=await sb.from('leads').select('id').eq('id',idParaDeletar);
            if(check.data && check.data.length>0){
              console.warn('RLS pode estar bloqueando o delete. Lead ainda existe no banco.');
              showToast('Erro: lead não foi removido do banco. Verifique as políticas RLS no Supabase.');
              return;
            }
          }catch(e){
            console.warn('Erro ao excluir lead do Supabase:',e);
            showToast('Erro ao excluir. Tente novamente.');
            return;
          }
        }
        // Só remove da memória local APÓS confirmação do banco
        LEADS=LEADS.filter(function(x){return x.id!==idParaDeletar;});
        closeModal();showToast('Lead excluído. ✅');
        renderCRM(document.getElementById('pc'),document.getElementById('tb-actions'));
      }
    });
  },0);
}

function moverEtapa(id){
  var l=LEADS.find(function(x){return x.id===id;});if(!l) return;
  var s=document.getElementById('et-lead');if(s) l.etapa=s.value;
  salvarLeadDB(l);
  closeModal();showToast('Lead atualizado!');
  renderCRM(document.getElementById('pc'),document.getElementById('tb-actions'));
}

function matricularLead(id){
  var l=LEADS.find(function(x){return x.id===id;});if(!l) return;
  l.etapa='matriculado';

  closeModal();
  // Abrir cadastro de aluna com dados do lead pré-preenchidos
  _horariosSelec=[];

    +'<div style="display:flex;gap:6px"><select id="ca-ddi" style="width:95px"><option value="+55">🇧🇷 +55</option><option value="+1">🇺🇸 +1</option><option value="+44">🇬🇧 +44</option><option value="+351">🇵🇹 +351</option><option value="+34">🇪🇸 +34</option></select>'
    +'<input id="ca-tel" value="'+(l.tel||'')+'" style="flex:1"></div></div>'
    +'<div class="fg"><label>Senha de acesso</label><input type="password" id="ca-senha" placeholder="Crie uma senha"></div></div>'
    +'<div class="fst">Dados pedagógicos</div>'
    +'<div class="fgrid"><div class="fg"><label>Nível</label><select id="ca-nivel"><option value="A1">A1</option><option value="A2">A2</option><option value="B1">B1</option><option value="B2">B2</option><option value="C1">C1</option><option value="C2">C2</option></select></div>'
    +'<div class="fg"><label>Teacher</label><select id="ca-teacher">'+tOpts+'</select></div></div>'
    +'<div class="fgrid"><div class="fg"><label>Aulas/semana</label><select id="ca-aulas-semana"><option value="1">1x</option><option value="2">2x</option><option value="3">3x</option><option value="4">4x</option><option value="5">5x</option></select></div>'
    +'<div class="fg"><label>Horários disponíveis</label><div id="ca-horarios-disp" style="background:rgba(121,20,40,.03);border-radius:8px;padding:8px;min-height:40px;font-size:11px;color:var(--crose)">Selecione uma teacher.</div></div></div>'
    +'<div class="fst">Financeiro</div>'
    +'<div class="fgrid"><div class="fg"><label>Plano</label><select id="ca-plano"><option value="Mensal">Mensal</option><option value="Trimestral">Trimestral</option><option value="Semestral">Semestral</option><option value="Anual">Anual</option><option value="Publicidade">🎁 Publicidade</option></select></div>'
    +'<div class="fg"><label>Valor R$</label><input type="number" id="ca-valor" value="320"></div>'
    +'<div class="fg"><label>Vencimento</label><select id="ca-venc">'+vOpts+'</select></div>'
    +'<div class="fg"><label>Financeiro</label><select id="ca-fin"><option value="Pendente">Pendente</option><option value="Pago">Pago</option></select></div></div>'
    +'<div class="mftr"><button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>'
    +'<button class="btn btn-primary" onclick="salvarAluna()">Matricular</button></div>';
  openModal(html);
  setTimeout(function(){
    var st=document.getElementById('ca-teacher');
    var sa=document.getElementById('ca-aulas-semana');
    if(st){st.addEventListener('change',atualizarHorariosDisp);atualizarHorariosDisp();}
    if(sa){sa.addEventListener('change',function(){_horariosSelec=[];atualizarHorariosDisp();});}
  },0);
}

function renderFunil(c,a){
  var etLabels=ETAPAS.map(function(e){return etLbl(e);});
  var counts=ETAPAS.map(function(e){return LEADS.filter(function(l){return l.etapa===e;}).length;});
  var total=LEADS.length||1;
  var cores=['#bc5572','#9b4060','#7a2f4e','#591e3c','#38102a','#888'];
  c.innerHTML='<div class="card"><div class="ch"><i class="ti ti-filter"></i><h3>Funil de Vendas</h3></div>'
    +'<div style="display:flex;gap:10px;align-items:flex-end;height:200px;margin-bottom:16px">'
    +ETAPAS.map(function(e,i){
      var cnt=counts[i];
      var pct=Math.max(10,Math.round(cnt/total*100));
      return '<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px">'
        +'<div style="font-size:14px;font-weight:700;color:var(--cd)">'+cnt+'</div>'
        +'<div style="width:100%;background:'+cores[i]+';height:'+pct+'%;border-radius:6px 6px 0 0;transition:height .3s"></div>'
        +'<div style="font-size:9px;color:var(--crose);text-align:center">'+etLabels[i]+'</div></div>';

function renderMatriculas(c,a){
  a.innerHTML='<button class="btn btn-primary btn-sm" onclick="openCadastrarAluna()"><i class="ti ti-plus"></i> Nova matrícula</button>';
  c.innerHTML='<div class="card"><div class="ch"><i class="ti ti-file-plus"></i><h3>Matrículas</h3></div>'

<script>
// ══════════════════════════════════════════════════════
// AULAS / RELATÓRIOS

var _aulasFiltroAluna='';
var _aulasFiltroTeacher='';
function renderAulas(c,a){
  a.innerHTML='<button class="btn btn-primary btn-sm" onclick="openModal(mNovaAula())"><i class="ti ti-plus"></i> Registrar aula</button>';
  var myTeacherUUID=_teacherIdMap[S.teacherId]||S.teacherId;
  var listaBase=S.perfil==='teacher'
    ?AULAS.filter(function(r){return r.teacherId===myTeacherUUID||r.teacherId===S.teacherId;})
    :AULAS;

  // Filtro por teacher (gestão/pedagógico)
  var teacherOpts='';
  if(S.perfil!=='teacher'){
    teacherOpts='<option value="">Todas as teachers</option>'
      +TEACHERS.slice().sort(function(a,b){
          if((a.ativo===false)!==(b.ativo===false)) return (a.ativo===false)?1:-1;
          return a.nome.localeCompare(b.nome,'pt');
        }).map(function(t){
        var tUUID=_teacherIdMap[t.id]||t.id;
        var tag=(t.ativo===false)?' (ex-teacher)':'';
        return '<option value="'+tUUID+'"'+((tUUID===_aulasFiltroTeacher||t.id===_aulasFiltroTeacher)?' selected':'')+'>'+t.nome+tag+'</option>';
      }).join('');
  }

  // Filtro por aluna — filtrado pela teacher selecionada
  var alunosFiltrados=S.perfil!=='teacher'&&_aulasFiltroTeacher
    ?ALUNOS.filter(function(al){return al.teacherId===_aulasFiltroTeacher||_teacherIdMap[al.teacherId]===_aulasFiltroTeacher;})

function contarReposicoesDoMes(alunoId){
  var hoje=new Date();
  var mes=hoje.getMonth(); var ano=hoje.getFullYear();
  return AULAS.filter(function(a){
    if(a.alunoId!==alunoId||!a.reposicao) return false;
    var d=new Date(a.data);
    return d.getMonth()===mes&&d.getFullYear()===ano;
  }).length;
}

function verificarLimiteReposicao(){
  var alunoId=(document.getElementById('na-aluno')||{value:''}).value;
  var cb=document.getElementById('na-reposicao');
  var cont=document.getElementById('rep-contador');
  if(!alunoId||!cont) return;
  var qtd=contarReposicoesDoMes(alunoId);
  cont.textContent=qtd+'/4 reposições este mês';
  cont.style.color=qtd>=4?'#dc2626':'var(--crose)';
  if(cb&&qtd>=4&&cb.checked){
    cb.checked=false;
    showToast('⚠️ Limite de 4 reposições mensais atingido para este aluno!');
  }
}

async function salvarAula(){
  var alunoId=document.getElementById('na-aluno').value;
  if(!alunoId){showToast('Selecione a aluna.');return;}
  // Resolver UUID do banco para o teacherId local
  var teacherUUID=await resolveTeacherId(S.teacherId)||S.teacherId||'';
  // Verificar limite de reposições
  var isReposicao=document.getElementById('na-reposicao')&&document.getElementById('na-reposicao').checked;
  if(isReposicao&&contarReposicoesDoMes(alunoId)>=4){
    showToast('⚠️ Limite de 4 reposições mensais atingido para este aluno!'); return;
  }
  var newAula={id:uuid(),alunoId:alunoId,teacherId:teacherUUID,reposicao:isReposicao,
    data:document.getElementById('na-data').value,
    presenca:document.getElementById('na-pres').value,
    conteudo:document.getElementById('na-cont').value||'',
    topico:(document.getElementById('na-topico').value||'').trim(),
    pagina:(document.getElementById('na-pagina').value||'').trim(),
    desempenho:document.getElementById('na-desemp').value,
    speaking:document.getElementById('na-speak').value,
    participacao:document.getElementById('na-part').value,
    homework:document.getElementById('na-hw').value||'',
    dificuldades:document.getElementById('na-dif').value||'',
    obs:document.getElementById('na-obs').value||''};
  // Atualizar presença da aluna
  var al=ALUNOS.find(function(a){return a.id===alunoId;});
  if(al&&newAula.presenca==='Faltou'){
    al.faltas=(al.faltas||0)+1;
    // Contar faltas SEGUIDAS
    var aulasOrdenadas=AULAS.filter(function(x){return x.alunoId===al.id;})
      .sort(function(a,b){return b.data.localeCompare(a.data);});
    var faltasSeguidas=0;
    for(var i=0;i<aulasOrdenadas.length;i++){
      if(aulasOrdenadas[i].presenca==='Faltou') faltasSeguidas++;
      else break;
    }
    faltasSeguidas++; // conta a aula atual
    if(faltasSeguidas>=4){
      al.status='Desaparecido';
      showToast('⚠️ '+al.nome+' marcado como DESAPARECIDO ('+faltasSeguidas+' faltas seguidas)');
    } else if(al.faltas>=2){
      if(al.status!=='Desaparecido') al.status='Atenção';
    }
    salvarAlunaDB(al);
  } else if(al&&newAula.presenca==='Presente'){
    // Ao retornar, limpar status de desaparecido/atenção se faltas ok
    if(al.status==='Desaparecido'||al.status==='Atenção'){
      al.status='Ativo';
      showToast('✅ '+al.nome+' voltou! Status restaurado para Ativo.');
      salvarAlunaDB(al);
    }
  }
  AULAS.unshift(newAula);
  salvarAulaDB(newAula);
  closeModal();showToast('Aula registrada! ✅');
  renderAulas(document.getElementById('pc'),document.getElementById('tb-actions'));
}

function aplicarFiltroStatusAluno(val){

    el.classList.toggle('sc-filtro-ativo',el.dataset.filtro===_alunosFiltroStatus&&_alunosFiltroStatus!=='');
  });
  filtrarAlunos();
}
function filtrarAlunos(){
  var inp=document.getElementById('busca-aluno');
  var t=(inp?inp.value:'').toLowerCase().trim();
  var filtro=_alunosFiltroStatus;
  var filtrada=_alunosListaCache.filter(function(al){
    if(t&&(al.nome||'').toLowerCase().indexOf(t)===-1) return false;
    if(filtro==='risco'){ if(al.risco==='low') return false; }
    else if(filtro==='Atrasado'){ if(al.fin!=='Atrasado') return false; }
    else if(filtro){ if(al.status!==filtro) return false; }
    return true;
  });
  var wrap=document.getElementById('alunos-tbl-wrap');
  if(wrap) wrap.innerHTML=tabelaAlunosHtml(filtrada);
}

function renderRetencao(c,a){
  var emRisco=ALUNOS.filter(function(al){
    return al.status==='Desaparecido'||al.status==='Atenção'||al.freq<85||(al.faltas||0)>=2||al.fin==='Atrasado'||al.risco!=='low';
  });
  // Desaparecidas primeiro, depois Atenção, depois o resto em ordem alfabética
  var peso={'Desaparecido':0,'Atenção':1};
  emRisco.sort(function(a,b){
    var pa=peso[a.status]!==undefined?peso[a.status]:2;
    var pb=peso[b.status]!==undefined?peso[b.status]:2;
    return pa!==pb?pa-pb:a.nome.localeCompare(b.nome,'pt');
  });
  function motivoRisco(al){
    var m=[];
    if(al.status==='Desaparecido')m.push('🚨 Desaparecida');
    if(al.status==='Atenção')m.push('⚠️ Atenção');
    if(al.freq<85)m.push('Freq. baixa');
    if((al.faltas||0)>=2)m.push((al.faltas)+' faltas');
    if(al.fin==='Atrasado')m.push('Inadimplente');
    if(al.risco!=='low'&&!m.length)m.push('Risco sinalizado');
    return m.join(' · ');
  }
  var avisaram=ALUNOS.filter(function(al){return al.avisoCancelamento;})
    .sort(function(a,b){return (b.avisoCancelamentoData||'').localeCompare(a.avisoCancelamentoData||'');});
  var avisoHtml=avisaram.length?'<div class="card" style="margin-bottom:14px"><div class="ch"><i class="ti ti-alert-triangle"></i><h3>🔔 Avisaram que vão cancelar ('+avisaram.length+')</h3></div>'
    +'<table class="tbl"><tr><th>Aluna</th><th>Teacher</th><th>Avisou em</th><th>Status</th></tr>'
    +avisaram.map(function(al){
      return '<tr style="background:rgba(245,158,11,.05)"><td class="nm" data-alid="'+al.id+'">'+al.nome+'</td><td>'+getTeacher(al.teacherId).nome+'</td>'
        +'<td>'+(al.avisoCancelamentoData?fmtDateBr(al.avisoCancelamentoData):'—')+'</td><td>'+bdg(al.status)+'</td></tr>';
    }).join('')+'</table></div>':'';
  c.innerHTML=avisoHtml+'<div class="card"><div class="ch"><i class="ti ti-heart"></i><h3>Alunas em risco ('+emRisco.length+')</h3></div>'
    +(emRisco.length?'<table class="tbl"><tr><th>Aluna</th><th>Teacher</th><th>Status</th><th>Freq.</th><th>Financeiro</th><th>Motivo</th></tr>'
      +emRisco.map(function(al){
        var destaque=al.status==='Desaparecido'?' style="background:rgba(239,68,68,.05)"':al.status==='Atenção'?' style="background:rgba(245,158,11,.05)"':'';
        return '<tr'+destaque+'><td class="nm" data-alid="'+al.id+'">'+al.nome+'</td><td>'+getTeacher(al.teacherId).nome+'</td><td>'+bdg(al.status)+'</td><td>'+al.freq+'%</td><td>'+bdgFin(al)+'</td><td style="font-size:11px;color:var(--crose)">'+motivoRisco(al)+'</td></tr>';
      }).join('')+'</table>'
      :'<div style="text-align:center;padding:40px;color:var(--crose)">✅ Nenhuma aluna em risco!</div>')+'</div>';
}
</script>
<script>
// ══════════════════════════════════════════════════════
// FINANCEIRO
// ══════════════════════════════════════════════════════
// Vencimentos: visão completa de todas as alunas pagantes organizadas por dia de vencimento,
// com a previsão de valor a receber em cada dia. Mostra ativas, atrasadas/inadimplentes
// e pausadas por inadimplência. Só não aparecem aqui: canceladas e pausadas a pedido.
function alunosVencimentos(){
  return ALUNOS.filter(function(a){return isPagante(a)&&a.status!=='Pausado';});
}
// "YYYY-MM" do mês atual — usado pra saber se um ajuste/cancelamento pontual ainda vale este mês.
function mesRefAtual(){
  var d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
}
// Valor que vale pra cobrança deste mês: 0 se a cobrança foi cancelada este mês,
// senão o ajuste pontual se ele for deste mês, senão o valor normal.
function valorEfetivoMes(al){
  if(al.cobrancaCanceladaRef===mesRefAtual()) return 0;
  if(al.ajusteValorMesRef===mesRefAtual()&&al.ajusteValorMesValor!=null) return al.ajusteValorMesValor;
  return parseFloat(al.valor)||0;
}
function renderVencimentos(c,a){
  atualizarDiasInadimplente();
  var mesRef=mesRefAtual();
  var lista=alunosVencimentos();
  var previstoTotal=lista.reduce(function(s,al){return s+valorEfetivoMes(al);},0);
  var canceladasQtd=lista.filter(function(al){return al.cobrancaCanceladaRef===mesRef;}).length;
  var inadimplentes=lista.filter(function(al){return al.fin==='Atrasado';}).length;
  // Agrupar por vencimento (inclui qualquer dia fora dos padrões num grupo "Outros")
  var grupos=VENC.slice();
  var porVenc={};
  grupos.forEach(function(v){porVenc[v]=[];});
  var outros=[];
  lista.forEach(function(al){
    var v=parseInt(al.venc)||10;
    if(porVenc[v]) porVenc[v].push(al); else outros.push(al);
  });
  grupos.forEach(function(v){porVenc[v].sort(function(a,b){return a.nome.localeCompare(b.nome,'pt');});});
  outros.sort(function(a,b){return a.nome.localeCompare(b.nome,'pt');});
  function linhaAluna(al){
    var canceladaMes=al.cobrancaCanceladaRef===mesRef;
    var temAjusteMes=!canceladaMes&&al.ajusteValorMesRef===mesRef&&al.ajusteValorMesValor!=null;
    var badge=al.desconto>0?'<span style="font-size:10px;background:#fef9c3;color:#854d0e;border-radius:4px;padding:1px 5px;margin-left:4px">-'+al.desconto+'%</span>':'';
    var ajusteBadge=temAjusteMes?'<span style="font-size:10px;background:#dbeafe;color:#1e40af;border-radius:4px;padding:1px 5px;margin-left:4px">só este mês</span>':'';
    var canceladaBadge=canceladaMes?'<span style="font-size:10px;background:#f3f4f6;color:#6b7280;border-radius:4px;padding:1px 5px;margin-left:4px">cobrança cancelada</span>':'';
    var valorStr;
    if(canceladaMes){
      valorStr='<span style="color:#9ca3af">— sem cobrança este mês</span>';
    } else {
      var valorEfetivo=valorEfetivoMes(al);
      valorStr='R$ '+valorEfetivo+(temAjusteMes?' <span style="font-size:10px;color:#aaa;text-decoration:line-through">R$'+al.valor+'</span>':(al.desconto>0?' <span style="font-size:10px;color:#aaa;text-decoration:line-through">R$'+al.valorCheio+'</span>':''));
    }
    var diasBadge=al.fin==='Atrasado'&&al.diasInadimplente?'<span style="font-size:10px;background:#fee2e2;color:#991b1b;border-radius:4px;padding:1px 5px;margin-left:4px">'+al.diasInadimplente+'d</span>':'';
    var acoes;
    if(canceladaMes){
      acoes='<button class="btn btn-ghost btn-sm" onclick="reativarCobrancaMes(\''+al.id+'\')"><i class="ti ti-player-play"></i> Reativar</button>';
    } else {
      var linha1='';
      if(al.fin!=='Pago') linha1+='<button class="btn btn-ghost btn-sm" data-alid="'+al.id+'" data-fin="Pago" onclick="marcarPgto(this)">✅ Pago</button>';
      linha1+='<button class="btn btn-ghost btn-sm" data-alid="'+al.id+'" data-fin="Atrasado" onclick="marcarPgto(this)" style="color:var(--crose)">⚠️ Atrasar</button>';
      var linha2='<button class="btn btn-ghost btn-sm" onclick="alterarValorMes(\''+al.id+'\')" title="Dar desconto ou mudar o valor só este mês">💰 Valor do mês</button>'
        +(temAjusteMes?'<button class="btn btn-ghost btn-sm" onclick="limparAjusteValorMes(\''+al.id+'\')" title="Remover o ajuste e voltar ao valor normal">↺ Desfazer</button>':'')
        +'<button class="btn btn-ghost btn-sm" onclick="cancelarCobrancaMes(\''+al.id+'\')" style="color:var(--crose)" title="Não cobra essa aluna este mês (ela continua aparecendo na lista)">🚫 Cancelar mês</button>';
      acoes='<div style="display:flex;gap:4px;flex-wrap:wrap">'+linha1+'</div>'
        +'<div style="display:flex;gap:4px;flex-wrap:wrap;margin-top:4px">'+linha2+'</div>';
    }
    return '<tr>'
      +'<td class="nm" data-alid="'+al.id+'">'+al.nome+badge+ajusteBadge+canceladaBadge+diasBadge+'</td>'
      +'<td>'+al.plano+'</td><td>'+valorStr+'</td><td>'+(canceladaMes?'—':bdgFin(al))+'</td><td>'+bdg(al.status)+'</td>'
      +'<td style="min-width:160px">'+acoes+'</td></tr>';
  }
  var tabelaHtml='';
  grupos.forEach(function(v){
    var gr=porVenc[v];
    if(!gr||!gr.length) return;
    var subtotal=gr.reduce(function(s,al){return s+valorEfetivoMes(al);},0);
    tabelaHtml+='<tr><td colspan="6" style="background:rgba(121,20,40,.07);font-weight:700;font-size:12px;padding:8px 12px;color:var(--cr)">📅 Vencimento dia '+v+' · '+gr.length+' aluna(s) · previsto R$ '+subtotal.toLocaleString('pt-BR')+'</td></tr>';
    tabelaHtml+=gr.map(linhaAluna).join('');
  });
  if(outros.length){
    var subtotalO=outros.reduce(function(s,al){return s+valorEfetivoMes(al);},0);
    tabelaHtml+='<tr><td colspan="6" style="background:rgba(121,20,40,.07);font-weight:700;font-size:12px;padding:8px 12px;color:var(--cr)">📅 Outros vencimentos · '+outros.length+' aluna(s) · previsto R$ '+subtotalO.toLocaleString('pt-BR')+'</td></tr>';
    tabelaHtml+=outros.map(linhaAluna).join('');
  }
  c.innerHTML='<div class="sg g3">'
    +'<div class="sc"><div class="sl">Alunas na lista</div><div class="sv">'+lista.length+'</div></div>'
    +'<div class="sc"><div class="sl">Previsto no total</div><div class="sv">R$ '+previstoTotal.toLocaleString('pt-BR')+'</div></div>'
    +'<div class="sc warn"><div class="sl">Em atraso/inadimplentes</div><div class="sv">'+inadimplentes+'</div></div>'
    +'</div>'
    +(canceladasQtd?'<div style="font-size:12px;color:var(--crose);margin-bottom:10px">🚫 '+canceladasQtd+' aluna(s) com cobrança cancelada este mês (aparecem na lista, sem valor).</div>':'')
    +'<div class="card"><div class="ch"><i class="ti ti-calendar-dollar"></i><h3>Vencimentos — previsão de recebimento</h3></div>'
    +(tabelaHtml?'<table class="tbl"><tr><th>Aluna</th><th>Plano</th><th>Valor</th><th>Financeiro</th><th>Status</th><th></th></tr>'+tabelaHtml+'</table>'
      :'<div style="text-align:center;padding:40px;color:var(--crose)">Nenhuma aluna nessa lista.</div>')+'</div>';
}
async function cancelarCobrancaMes(id){
  var al=ALUNOS.find(function(a){return a.id===id;});
  if(!al) return;
  if(!confirm('Cancelar a cobrança de '+al.nome+' só este mês? Ela sai da lista de Vencimentos deste mês e volta a cobrar normalmente no mês que vem.')) return;
  al.cobrancaCanceladaRef=mesRefAtual();
  await salvarAlunaDB(al);
  showToast('Cobrança deste mês cancelada para '+al.nome+'.');
  renderVencimentos(document.getElementById('pc'),document.getElementById('tb-actions'));
}
async function reativarCobrancaMes(id){
  var al=ALUNOS.find(function(a){return a.id===id;});
  if(!al) return;
  al.cobrancaCanceladaRef=null;
  await salvarAlunaDB(al);
  showToast('Cobrança reativada para '+al.nome+'.');
  renderVencimentos(document.getElementById('pc'),document.getElementById('tb-actions'));
}
async function alterarValorMes(id){
  var al=ALUNOS.find(function(a){return a.id===id;});
  if(!al) return;
  var atual=valorEfetivoMes(al);
  var novo=prompt('Novo valor de '+al.nome+' só para este mês (no mês que vem volta pro normal, R$ '+al.valor+'):',String(atual));
  if(novo===null) return;
  var v=parseFloat(novo.replace(',','.'));
  if(isNaN(v)||v<0){ showToast('Valor inválido.'); return; }
  al.ajusteValorMesRef=mesRefAtual();
  al.ajusteValorMesValor=v;
  await salvarAlunaDB(al);
  showToast('Valor deste mês ajustado para R$ '+v+' ✅');
  renderVencimentos(document.getElementById('pc'),document.getElementById('tb-actions'));
}
async function limparAjusteValorMes(id){
  var al=ALUNOS.find(function(a){return a.id===id;});
  if(!al) return;
  al.ajusteValorMesRef=null; al.ajusteValorMesValor=null;
  await salvarAlunaDB(al);
  showToast('Ajuste removido — valor voltou ao normal este mês.');
  renderVencimentos(document.getElementById('pc'),document.getElementById('tb-actions'));
}

function renderPagamentos(soloInadimplentes){
  var c=document.getElementById('pc');
  atualizarDiasInadimplente();
  // Filtrar: excluir desaparecidos e alunos com +15 dias atraso (só se não for aba inadimplência)
  var listaBase=ALUNOS.filter(function(a){
    if(!isPagante(a)) return false;
    if(a.status==='Desaparecido') return false;
    if(!soloInadimplentes && a.fin==='Atrasado' && a.diasInadimplente>15) return false;
    return true;
  });
  var lista=soloInadimplentes
    ?listaBase.filter(function(a){return a.fin==='Atrasado';})
    :listaBase;
  var total=ALUNOS.filter(isPagante).reduce(function(s,a){return s+(a.fin==='Pago'?a.valor:0);},0);
  var previsto=ALUNOS.filter(function(a){return a.status!=='Desaparecido'&&isPagante(a);}).reduce(function(s,a){return s+a.valor;},0);
  var inadimplentes=ALUNOS.filter(function(a){return a.fin==='Atrasado'&&isPagante(a);}).length;
  // Agrupar por vencimento
  var grupos=[5,10,15,20,30];
  var porVenc={};
  grupos.forEach(function(v){porVenc[v]=[];});
  lista.forEach(function(al){
    var v=parseInt(al.venc)||10;
    if(!porVenc[v]) porVenc[v]=[];
    porVenc[v].push(al);
  });
  // Ordenar cada grupo alfabeticamente
  grupos.forEach(function(v){
    porVenc[v].sort(function(a,b){return a.nome.localeCompare(b.nome,'pt');});
  });
  var tabelaHtml='';
  grupos.forEach(function(v){
    var gr=porVenc[v];
    if(!gr||!gr.length) return;
    tabelaHtml+='<tr><td colspan="6" style="background:rgba(121,20,40,.07);font-weight:700;font-size:12px;padding:8px 12px;color:var(--cr)">📅 Vencimento dia '+v+'</td></tr>';
    gr.forEach(function(al){
      var badge=al.desconto>0?'<span style="font-size:10px;background:#fef9c3;color:#854d0e;border-radius:4px;padding:1px 5px;margin-left:4px">-'+al.desconto+'%</span>':'';
      var valorStr='R$ '+al.valor+(al.desconto>0?' <span style="font-size:10px;color:#aaa;text-decoration:line-through">R$'+al.valorCheio+'</span>':'');
      var diasBadge=al.fin==='Atrasado'&&al.diasInadimplente?'<span style="font-size:10px;background:#fee2e2;color:#991b1b;border-radius:4px;padding:1px 5px;margin-left:4px">'+al.diasInadimplente+'d</span>':'';
      tabelaHtml+='<tr>'
        +'<td class="nm" data-alid="'+al.id+'">'+al.nome+badge+diasBadge+'</td>'
        +'<td>'+al.plano+'</td><td>'+valorStr+'</td><td>Dia '+al.venc+'</td><td>'+bdgFin(al)+'</td>'
        +'<td style="display:flex;gap:4px">'
        +'<button class="btn btn-ghost btn-sm" data-alid="'+al.id+'" data-fin="Pago" onclick="marcarPgto(this)">✅ Pago</button>'
        +'<button class="btn btn-ghost btn-sm" data-alid="'+al.id+'" data-fin="Atrasado" onclick="marcarPgto(this)" style="color:var(--crose)">⚠️ Atrasar</button>'
        +'</td></tr>';
    });
  });
  c.innerHTML='<div class="sg g3">'
    +'<div class="sc"><div class="sl">Receita recebida</div><div class="sv">R$ '+total.toLocaleString('pt-BR')+'</div></div>'
    +'<div class="sc"><div class="sl">Previsto</div><div class="sv">R$ '+previsto.toLocaleString('pt-BR')+'</div></div>'
    +'<div class="sc warn"><div class="sl">Inadimplentes</div><div class="sv">'+inadimplentes+'</div></div>'
    +'</div>'
    +'<div class="card"><div class="ch"><i class="ti ti-cash"></i><h3>'+(soloInadimplentes?'Inadimplentes':'Mensalidades')+'</h3></div>'
    +(tabelaHtml?'<table class="tbl"><tr><th>Aluna</th><th>Plano</th><th>Valor</th><th>Vencimento</th><th>Status</th><th></th></tr>'+tabelaHtml+'</table>'
      :'<div style="text-align:center;padding:40px;color:var(--crose)">Nenhuma aluna no fluxo.</div>')+'</div>';
}

function marcarPgto(btn){
  var alid=btn.dataset.alid;var fin=btn.dataset.fin;
  var al=ALUNOS.find(function(a){return a.id===alid;});
  if(!al) return;
  al.fin=fin;
  if(fin==='Atrasado'){
    if(!al.dataAtraso) al.dataAtraso=new Date().toISOString().split('T')[0];
    al.diasInadimplente=calcDiasAtraso(al.dataAtraso);
    // Volta valor ao cheio se tem desconto — a menos que o valor tenha sido travado manualmente
    if(al.desconto>0&&!al.valorManual){ al.valor=al.valorCheio; showToast('⚠️ Desconto removido — valor voltou para R$ '+al.valor); }
    estornarPagamentoHoje(al.id);
  } else if(fin==='Pago'){
    al.dataAtraso=null; al.diasInadimplente=0;
    // Restaurar desconto se tinha — a menos que o valor tenha sido travado manualmente
    if(al.desconto>0&&!al.valorManual){ al.valor=Math.round(al.valorCheio*(1-al.desconto/100)); }
    registrarPagamento(al);
  }
  salvarAlunaDB(al);
  showToast('Status atualizado!');
  renderFinanceiro(document.getElementById('pc'),document.getElementById('tb-actions'));
}
function calcDiasAtraso(dataAtraso){
  if(!dataAtraso) return 0;
  var d=new Date(dataAtraso);var hoje=new Date();
  return Math.floor((hoje-d)/(1000*60*60*24));
}
// Atualizar dias inadimplente de todos os alunos ao carregar
function atualizarDiasInadimplente(){
  var hoje=new Date();
  ALUNOS.forEach(function(al){
    // Autocorreção: marcado "Atrasado" por engano (antes do vencimento deste mês) mas que PAGOU o mês anterior volta a "Pendente".
    if(al.fin==='Atrasado'&&al.status==='Ativo'&&hoje.getDate()<=Math.min(parseInt(al.venc)||10,new Date(hoje.getFullYear(),hoje.getMonth()+1,0).getDate())){
      var mesAtualISO=hojeISO().slice(0,7);
      var pd=new Date(hoje.getFullYear(),hoje.getMonth()-1,1);
      var mesAntISO=pd.getFullYear()+'-'+('0'+(pd.getMonth()+1)).slice(-2);
      var pagouAnt=PAGAMENTOS.some(function(p){return p.alunoId===al.id&&(p.data||'').slice(0,7)===mesAntISO;});
      var pagouAtual=PAGAMENTOS.some(function(p){return p.alunoId===al.id&&(p.data||'').slice(0,7)===mesAtualISO;});
      if(pagouAnt&&!pagouAtual){
        al.fin='Pendente';al.dataAtraso=null;al.diasInadimplente=0;
        salvarAlunaDB(al);
        return;
      }
    }
    if(al.fin==='Atrasado'&&al.dataAtraso){
      al.diasInadimplente=calcDiasAtraso(al.dataAtraso);
      return;
    }
    // Escalonamento automático: se ninguém marcou "Pago" e já passou do dia de vencimento,
    // vira "Atrasado" sozinho — não depende mais de alguém clicar em "Atrasar" na tela.
    // Regra: quem pagou o mês anterior começa o mês EM DIA. Só vira "Atrasado" depois
    // do dia de vencimento DO MÊS ATUAL, se o pagamento não foi registrado.
    var ultDia=new Date(hoje.getFullYear(),hoje.getMonth()+1,0).getDate();
    var vencMes=Math.min(parseInt(al.venc)||10,ultDia);
    if(al.fin==='Pendente'&&al.status==='Ativo'&&isPagante(al)){
      var diasDesdeVenc=hoje.getDate()-vencMes;
      if(diasDesdeVenc>0){
        al.fin='Atrasado';
        al.dataAtraso=new Date(hoje.getTime()-diasDesdeVenc*86400000).toISOString().split('T')[0];
        al.diasInadimplente=diasDesdeVenc;
        salvarAlunaDB(al);
      }
    }
  });
}

function renderNF(c,a){
  c.innerHTML='<div class="card"><div class="ch"><i class="ti ti-receipt-2"></i><h3>Notas Fiscais</h3></div>'
    +'<table class="tbl"><tr><th>Aluna</th><th>Valor</th><th>Status NF</th><th>Arquivo</th><th></th></tr>'
    +byName(ALUNOS.filter(isPagante)).map(function(al){
      var nfLink=al.nfUrl
        ?'<a href="'+al.nfUrl+'" target="_blank" class="btn btn-ghost btn-sm">📄 Ver NF</a>'
        :'<span style="font-size:11px;color:#aaa">Sem arquivo</span>';
      return '<tr><td class="nm" data-alid="'+al.id+'">'+al.nome+'</td><td>R$ '+al.valor+'</td>'
        +'<td>'+bdg(al.nfEmitida?'NF Emitida':'Pendente')+'</td>'
        +'<td>'+nfLink+'</td>'
        +'<td style="display:flex;gap:4px;align-items:center">'
        +'<button class="btn btn-ghost btn-sm" data-alid="'+al.id+'" onclick="toggleNF(this.dataset.alid)">'+(al.nfEmitida?'Desmarcar':'✅ Marcar')+'</button>'
        +'<label class="btn btn-ghost btn-sm" style="cursor:pointer;margin:0" title="Anexar PDF">📎 PDF<input type="file" accept=".pdf" style="position:absolute;opacity:0;width:1px;height:1px;overflow:hidden;z-index:-1" onchange="uploadNF(event,\''+al.id+'\')"></label>'
        +'</td></tr>';
    }).join('')+'</table></div>';
}
function renderNegativacao(c,a){
  atualizarDiasInadimplente();
  var lista=ALUNOS.filter(function(al){return al.fin==='Atrasado'&&isPagante(al)&&(al.diasInadimplente||0)>10;})
    .sort(function(a,b){return (b.diasInadimplente||0)-(a.diasInadimplente||0);});
  c.innerHTML='<div class="card" style="border:2px solid #ef4444">'
    +'<div class="ch"><i class="ti ti-ban" style="color:#ef4444"></i><h3 style="color:#ef4444">Negativação ('+lista.length+')</h3></div>'
    +'<p style="font-size:12px;color:#666;padding:0 16px 12px">Alunos inadimplentes há mais de 10 dias — elegíveis para negativação do CPF.</p>'
    +(lista.length?'<table class="tbl"><tr><th>Aluno</th><th>Valor</th><th>Vencimento</th><th>Dias em atraso</th><th>Status</th></tr>'
      +lista.map(function(al){
        return '<tr style="background:rgba(239,68,68,.05)">'
          +'<td class="nm" data-alid="'+al.id+'">'+al.nome+'<div style="font-size:11px;color:#aaa">'+al.email+'</div></td>'
          +'<td>R$ '+al.valor+'</td><td>Dia '+al.venc+'</td>'
          +'<td><span style="font-weight:700;color:#ef4444">'+al.diasInadimplente+' dias</span></td>'
          +'<td>'+bdgFin(al)+'</td></tr>';

function toggleNF(id){
  var al=ALUNOS.find(function(a){return a.id===id;});
  if(al){
    al.nfEmitida=!al.nfEmitida;
    salvarAlunaDB(al);
    showToast(al.nfEmitida?'NF marcada como emitida ✅':'NF desmarcada');
    renderNF(document.getElementById('pc'),document.getElementById('tb-actions'));
  }
}
function uploadNF(event,alunaId){
  var file=event.target.files[0];
  if(!file) return;
  if(file.type!=='application/pdf'){showToast('Apenas arquivos PDF são aceitos.');return;}
  var al=ALUNOS.find(function(a){return a.id===alunaId;});
  if(!al) return;
  var reader=new FileReader();
  reader.onload=function(e){
    al.nfUrl=e.target.result;
    al.nfEmitida=true;
    salvarAlunaDB(al);
    showToast('NF de '+al.nome+' anexada! ✅');
    renderNF(document.getElementById('pc'),document.getElementById('tb-actions'));
  };
  reader.readAsDataURL(file);
}

function renderTeachers(c,a){
  function linhasTeachers(lista,ativas){
    return lista.map(function(t){
      var tUUID=_teacherIdMap[t.id]||t.id;
      var alunos=ALUNOS.filter(function(a){return a.teacherId===t.id||a.teacherId===tUUID;});
      var hoje=new Date();
      var aulasMes=AULAS.filter(function(a){
        if(a.teacherId!==t.id&&a.teacherId!==tUUID) return false;
        if(!a.data) return false;
        var d=new Date(a.data); return d.getMonth()===hoje.getMonth()&&d.getFullYear()===hoje.getFullYear();
      }).length;
      return '<tr style="cursor:pointer" onclick="abrirPerfilTeacher(\''+t.id+'\')">'
        +'<td class="nm" style="color:var(--cr)">'+t.nome+' <i class="ti ti-chevron-right" style="font-size:11px"></i></td>'
        +'<td>'+alunos.length+'</td>'
        +'<td>'+aulasMes+'</td>'
        +'<td>'+(t.retencao!==undefined?t.retencao+'%':'—')+'</td>'
        +'<td style="display:flex;gap:4px">'
        +'<button class="btn btn-ghost btn-sm" onclick="event.stopPropagation();abrirPerfilTeacher(\''+t.id+'\')"><i class="ti ti-eye"></i> Ver</button>'
        +(ativas
          ?'<button class="btn btn-ghost btn-sm" style="color:var(--crose)" onclick="event.stopPropagation();desativarTeacher(\''+t.id+'\')"><i class="ti ti-user-off"></i></button>'
          :'<button class="btn btn-ghost btn-sm" onclick="event.stopPropagation();reativarTeacher(\''+t.id+'\')"><i class="ti ti-user-check"></i> Reativar</button>')
        +'</td></tr>';
    }).join('');
  }
  var ativas=byName(teachersAtivas());
  var inativas=byName(TEACHERS.filter(function(t){return t.ativo===false;}));
  var html='<div class="card"><div class="ch"><i class="ti ti-school"></i><h3>Teachers — clique para ver alunos e histórico</h3></div>'
    +'<table class="tbl"><tr><th>Nome</th><th>Alunos</th><th>Aulas este mês</th><th>Retenção</th><th></th></tr>'
    +linhasTeachers(ativas,true)+'</table></div>';
  if(inativas.length){
    html+='<div class="card" style="margin-top:14px"><div class="ch"><i class="ti ti-archive"></i><h3>Ex-teachers — histórico preservado</h3></div>'
      +'<div style="font-size:12px;color:var(--crose);padding:0 16px 10px">Não aparecem em cadastros nem em novos horários, mas todas as aulas, fichas e registros delas continuam salvos. Clique para consultar.</div>'
      +'<table class="tbl"><tr><th>Nome</th><th>Alunos</th><th>Aulas este mês</th><th>Retenção</th><th></th></tr>'
      +linhasTeachers(inativas,false)+'</table></div>';
  }
  c.innerHTML=html;
}

async function desativarTeacher(teacherLocalId){
  var t=TEACHERS.find(function(x){return x.id===teacherLocalId;});
  if(!t) return;
  if(teacherLocalId==='t0'||teacherLocalId==='t1'){showToast('Esta conta (Lawanda/Kessia) não pode ser desativada por aqui.');return;}
  if(!confirm('Desativar '+t.nome+'? Ela some dos cadastros e da grade (histórico de aulas continua salvo) e o login dela deixa de funcionar.')) return;
  t.ativo=false; t.saidaEm=hojeISO().slice(0,7);
  await atualizarAtivoTeacherDB(teacherLocalId,false,t.saidaEm);
  // Remove também o login de equipe correspondente, se houver, pra ela não conseguir mais entrar
  var tUUID=_teacherIdMap[teacherLocalId]||teacherLocalId;
  var logins=EQUIPE.filter(function(e){return e.teacherId===teacherLocalId||e.teacherId===tUUID;});
  for(var i=0;i<logins.length;i++){ await excluirEquipeDB(logins[i].id); }
  EQUIPE=EQUIPE.filter(function(e){return e.teacherId!==teacherLocalId&&e.teacherId!==tUUID;});
  showToast('Teacher desativada.');
  renderTeachers(document.getElementById('pc'),document.getElementById('tb-actions'));
}

async function reativarTeacher(teacherLocalId){
  var t=TEACHERS.find(function(x){return x.id===teacherLocalId;});
  if(!t) return;
  t.ativo=true; t.saidaEm=null;
  await atualizarAtivoTeacherDB(teacherLocalId,true,null);
  showToast('Teacher reativada! ✅');
  renderTeachers(document.getElementById('pc'),document.getElementById('tb-actions'));
}

async function salvarPercentualTeacher(teacherLocalId){
  var el=document.getElementById('perfil-pct');
  if(!el) return;
  var pct=parseFloat(el.value);
  if(isNaN(pct)||pct<0||pct>100){ showToast('Informe um % válido (0 a 100).'); return; }
  var t=TEACHERS.find(function(x){return x.id===teacherLocalId;});
  if(!t) return;
  t.percentual=pct;
  await atualizarPercentualTeacherDB(teacherLocalId,pct);
  showToast('% de comissão atualizado! ✅');
  abrirPerfilTeacher(teacherLocalId);
}

  var titulo=(document.getElementById('ex-titulo').value||'').trim();
  if(!titulo){showToast('Preencha o título.');return;}
  var novoExtra={id:uuid(),titulo:titulo,nivel:document.getElementById('ex-nivel').value,
    duracao:document.getElementById('ex-dur').value,descricao:document.getElementById('ex-desc').value,
    videoUrl:document.getElementById('ex-url').value};
  EXTRAS.push(novoExtra);salvarExtraDB(novoExtra);closeModal();showToast('Aula extra adicionada! ✅');
  renderExtras(document.getElementById('pc'),document.getElementById('tb-actions'));
}

function renderMetas(c,a){
  a.innerHTML='<button class="btn btn-ghost btn-sm" onclick="openModal(mEditMetas())"><i class="ti ti-pencil"></i> Editar metas</button>';
  var items=[
    {key:'leads',l:'Leads captados'},
    {key:'matriculas',l:'Matrículas'},
    {key:'aulas_exp',l:'Aulas experimentais'},
    {key:'followups',l:'Follow-ups'},
    {key:'conversao',l:'Taxa de conversão (%)'},
  ];
  c.innerHTML='<div class="card"><div class="ch"><i class="ti ti-trophy"></i><h3>Metas do mês</h3></div>'
    +'<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px">'
    +items.map(function(item){
      var m=METAS[item.key]||{meta:0,atual:0};
      var pct=m.meta?Math.min(100,Math.round(m.atual/m.meta*100)):0;
      return '<div style="background:rgba(121,20,40,.03);border-radius:10px;padding:14px;border:1px solid rgba(121,20,40,.07)">'
        +'<div style="font-size:11px;color:var(--crose);font-weight:700;text-transform:uppercase;margin-bottom:6px">'+item.l+'</div>'
        +'<div style="font-size:22px;font-weight:700;color:var(--cd);margin-bottom:4px">'+m.atual+' <span style="font-size:13px;color:var(--crose)">/ '+m.meta+'</span></div>'
        +'<div style="height:6px;background:#eee;border-radius:3px;overflow:hidden"><div style="width:'+pct+'%;height:100%;background:'+(pct>=100?'#2d6a10':pct>=60?'#f39c12':'var(--cr)')+';border-radius:3px"></div></div>'
        +'<div style="font-size:10px;color:var(--crose);margin-top:4px">'+pct+'% da meta</div>'
        +'</div>';
    }).join('')+'</div></div>';
}
function mEditMetas(){
  var items=[{key:'leads',l:'Leads'},{key:'matriculas',l:'Matrículas'},{key:'aulas_exp',l:'Aulas exp.'},{key:'followups',l:'Follow-ups'},{key:'conversao',l:'Conversão %'}];
  return '<div class="mhdr"><h2>Editar metas</h2><button class="mclose" onclick="closeModal()">✕</button></div>'
    +'<div class="fgrid">'+items.map(function(it){var m=METAS[it.key]||{meta:0,atual:0};return '<div class="fg"><label>'+it.l+' (meta / atual)</label><div style="display:flex;gap:6px"><input type="number" id="mt-'+it.key+'-meta" value="'+m.meta+'" style="flex:1;padding:10px;border-radius:8px;border:1.5px solid rgba(121,20,40,.18);font-family:var(--font-sans)" placeholder="Meta"><input type="number" id="mt-'+it.key+'-atual" value="'+m.atual+'" style="flex:1;padding:10px;border-radius:8px;border:1.5px solid rgba(121,20,40,.18);font-family:var(--font-sans)" placeholder="Atual"></div></div>';}).join('')+'</div>'
    +'<div class="mftr"><button class="btn btn-ghost" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="salvarMetas()">Salvar</button></div>';
}
function salvarMetas(){
  ['leads','matriculas','aulas_exp','followups','conversao'].forEach(function(k){
    var m=parseInt(document.getElementById('mt-'+k+'-meta').value)||0;
    var at=parseInt(document.getElementById('mt-'+k+'-atual').value)||0;
    METAS[k]={meta:m,atual:at};
  });
  closeModal();showToast('Metas atualizadas! ✅');
  renderMetas(document.getElementById('pc'),document.getElementById('tb-actions'));
}
</script>
<script>
// ══════════════════════════════════════════════════════
// NOTAS DA DIRETORIA
// ══════════════════════════════════════════════════════
function renderNotas(c,a){
  a.innerHTML='<button class="btn btn-primary btn-sm" onclick="openModal(mNovaNota())"><i class="ti ti-plus"></i> Nova nota</button>';
  var urgCor={alta:'#fce4ec',media:'#fff3e0',baixa:'#e8f5e9'};
  var urgLabel={alta:'🔴 Alta',media:'🟡 Média',baixa:'🟢 Baixa'};
  var notas=NOTAS.slice().sort(function(a,b){var u={alta:0,media:1,baixa:2};return (u[a.urgencia]||1)-(u[b.urgencia]||1);});
  c.innerHTML='<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px">'
    +(notas.length?notas.map(function(n,i){
      return '<div class="nota-card" style="background:'+(urgCor[n.urgencia]||'#f5f5f5')+';opacity:'+(n.resolvido?.6:1)+'">'
        +(n.resolvido?'<div style="display:inline-block;background:#2d6a10;color:#fff;font-size:9px;padding:2px 8px;border-radius:10px;font-weight:700;margin-bottom:6px">✓ RESOLVIDO</div>':'')
        +'<div style="font-size:15px;font-weight:700;color:var(--cd);margin-bottom:6px">'+n.titulo+'</div>'
        +'<div style="font-size:11px;color:#777;margin-bottom:10px;display:flex;gap:8px;flex-wrap:wrap">'
        +'<span>'+urgLabel[n.urgencia||'media']+'</span>'
        +(n.prazo?'<span>📅 Prazo: '+n.prazo+'</span>':'')
        +'<span style="opacity:.7">🕐 '+n.criadoEm+'</span>'
        +'</div>'
        +(n.texto?'<div style="font-size:12px;color:#444;white-space:pre-wrap;line-height:1.6;margin-bottom:12px">'+n.texto+'</div>':'')
        +'<div style="display:flex;justify-content:flex-end;gap:6px">'
        +'<button class="btn btn-ghost btn-sm" data-ni="'+i+'" onclick="toggleResolvida(parseInt(this.dataset.ni))">'+(n.resolvido?'↩ Reabrir':'✓ Resolver')+'</button>'
        +'<button class="btn btn-ghost btn-sm" data-ni="'+i+'" onclick="editarNota(parseInt(this.dataset.ni))"><i class="ti ti-pencil"></i></button>'
        +'<button class="btn btn-ghost btn-sm" style="color:var(--crose)" data-ni="'+i+'" onclick="excluirNota(parseInt(this.dataset.ni))"><i class="ti ti-trash"></i></button>'
        +'</div></div>';
    }).join('')
    :'<div style="grid-column:1/-1;text-align:center;padding:60px;color:var(--crose)"><i class="ti ti-notebook" style="font-size:48px;display:block;margin-bottom:12px"></i><div style="font-size:14px;font-weight:600;color:var(--cd)">Nenhuma nota ainda</div></div>')
    +'</div>';
}

function mNovaNota(idx){
  var n=(idx!==undefined&&NOTAS[idx])?NOTAS[idx]:{titulo:'',texto:'',urgencia:'media',prazo:'',resolvido:false};
  window._editNota=idx;
  return '<div class="mhdr"><h2>'+(idx!==undefined?'Editar nota':'Nova nota')+'</h2><button class="mclose" onclick="closeModal()">✕</button></div>'
    +'<div class="fg" style="margin-bottom:10px"><label>Título</label><input id="nota-titulo" value="'+(n.titulo||'')+'" placeholder="Título da nota..."></div>'
    +'<div class="fgrid"><div class="fg"><label>Urgência</label><select id="nota-urg">'
    +'<option value="alta"'+(n.urgencia==='alta'?' selected':'')+'>🔴 Alta</option>'
    +'<option value="media"'+(n.urgencia==='media'?' selected':'')+'>🟡 Média</option>'
    +'<option value="baixa"'+(n.urgencia==='baixa'?' selected':'')+'>🟢 Baixa</option>'
    +'</select></div>'
    +'<div class="fg"><label>Prazo para resolver</label><input type="date" id="nota-prazo" value="'+(n.prazo||'')+'"></div></div>'
    +'<div class="fg"><label>Conteúdo</label>'
    +'<textarea id="nota-texto" style="width:100%;min-height:120px;padding:12px;border-radius:8px;border:1.5px solid rgba(121,20,40,.18);background:#fff;font-family:var(--font-sans);font-size:13px;color:var(--cd);resize:vertical;outline:none" placeholder="Descreva...">'+(n.texto||'')+'</textarea></div>'
    +'<div class="mftr"><button class="btn btn-ghost" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="salvarNota()">Salvar</button></div>';
}

function salvarNota(){
  var titulo=(document.getElementById('nota-titulo').value||'').trim();
  if(!titulo){showToast('Coloque um título!');return;}
  var now=new Date();
  var criadoEm=now.toLocaleDateString('pt-BR')+' '+String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
  var prazoEl=document.getElementById('nota-prazo');
  var prazo=prazoEl&&prazoEl.value?new Date(prazoEl.value+'T12:00').toLocaleDateString('pt-BR'):'';
  var urg=(document.getElementById('nota-urg')||{value:'media'}).value;
  var texto=(document.getElementById('nota-texto')||{value:''}).value;
  if(window._editNota!==undefined&&NOTAS[window._editNota]){
    var orig=NOTAS[window._editNota];
    NOTAS[window._editNota]={titulo:titulo,texto:texto,urgencia:urg,prazo:prazo,criadoEm:orig.criadoEm,resolvido:orig.resolvido};
  } else {
    NOTAS.unshift({titulo:titulo,texto:texto,urgencia:urg,prazo:prazo,criadoEm:criadoEm,resolvido:false});
  }
  window._editNota=undefined;
  closeModal();showToast('Nota salva! ✅');
  renderNotas(document.getElementById('pc'),document.getElementById('tb-actions'));
}
function editarNota(i){window._editNota=i;openModal(mNovaNota(i));}
function toggleResolvida(i){if(NOTAS[i]){NOTAS[i].resolvido=!NOTAS[i].resolvido;renderNotas(document.getElementById('pc'),document.getElementById('tb-actions'));}}
function excluirNota(i){if(confirm('Excluir?')){NOTAS.splice(i,1);renderNotas(document.getElementById('pc'),document.getElementById('tb-actions'));}}

// Ao marcar como Atrasado, valor volta ao original (sem desconto)
function marcarFinanceiro(alunaId, status){
  var al=ALUNOS.find(function(a){return a.id===alunaId;});
  if(!al) return;
  al.fin=status;
  if(status==='Atrasado' && al.desconto>0 && !al.valorManual){
    // Volta ao valor cheio (a menos que o valor tenha sido travado manualmente)
    al.valor=al.valorCheio||al.valor;
    showToast('⚠️ Mensalidade atrasada — desconto removido, valor voltou para R$ '+al.valor);
  }
  salvarAlunaDB(al);
  renderFinanceiro(document.getElementById('pc'),document.getElementById('tb-actions'));
}

// ══════════════════════════════════════════════════════
// TAREFAS (Diretoria + Pedagógico)
// ══════════════════════════════════════════════════════
function renderTarefas(c,a){
  a.innerHTML='<button class="btn btn-primary btn-sm" onclick="openModal(mNovaTarefa())"><i class="ti ti-plus"></i> Nova tarefa</button>';
  if(!TAREFAS.length){
    c.innerHTML='<div class="card" style="text-align:center;padding:40px;color:var(--crose)"><i class="ti ti-checklist" style="font-size:36px;display:block;margin-bottom:12px"></i>Nenhuma tarefa criada ainda.</div>';
    return;
  }
  c.innerHTML='<div class="card"><div class="ch"><i class="ti ti-checklist"></i><h3>Tarefas</h3></div>'
    +TAREFAS.map(function(t){
      return '<div style="display:flex;align-items:center;gap:12px;padding:10px;background:rgba(121,20,40,.03);border-radius:9px;margin-bottom:8px;border:1px solid rgba(121,20,40,.07)">'
        +'<div style="flex:1">'
        +'<div style="font-size:13px;font-weight:700;color:var(--cd)">'+t.titulo+'</div>'
        +'<div style="font-size:11px;color:var(--crose);margin-top:2px">'+(t.descricao||'')+(t.prazo?' · Prazo: '+fmtDateBr(t.prazo):'')+'</div>'
        +'</div>'
        +bdg(t.status==='concluido'?'Pago':t.status==='andamento'?'Pendente':'Pendente')
        +'<button class="btn btn-ghost btn-sm" data-tarid="'+t.id+'" onclick="concluirTarefa(this.dataset.tarid)">'+(t.status==='concluido'?'↩':'✓')+'</button></div>';
    }).join('')+'</div>';
}
function mNovaTarefa(){
  return '<div class="mhdr"><h2>Nova tarefa</h2><button class="mclose" onclick="closeModal()">✕</button></div>'
    +'<div class="fg" style="margin-bottom:10px"><label>Título</label><input id="ta-titulo" placeholder="Descreva a tarefa..."></div>'
    +'<div class="fg" style="margin-bottom:10px"><label>Descrição</label><input id="ta-desc" placeholder="Detalhes..."></div>'
    +'<div class="fgrid"><div class="fg"><label>Prioridade</label><select id="ta-prior"><option value="alta">Alta</option><option value="media" selected>Média</option><option value="baixa">Baixa</option></select></div>'
    +'<div class="fg"><label>Prazo</label><input type="date" id="ta-prazo"></div></div>'
    +'<div class="mftr"><button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>'
    +'<button class="btn btn-primary" onclick="salvarTarefa()">Salvar</button></div>';
}
function salvarTarefa(){
  var titulo=(document.getElementById('ta-titulo').value||'').trim();
  if(!titulo){showToast('Coloque um título.');return;}
  var novaTarefa={id:uuid(),titulo:titulo,descricao:document.getElementById('ta-desc').value||'',
    prioridade:document.getElementById('ta-prior').value,prazo:document.getElementById('ta-prazo').value||'',
    status:'pendente',criadorNome:S.userName};
  TAREFAS.push(novaTarefa);salvarTarefaDB(novaTarefa);closeModal();showToast('Tarefa criada! ✅');
  renderTarefas(document.getElementById('pc'),document.getElementById('tb-actions'));
}
function concluirTarefa(id){
  var t=TAREFAS.find(function(x){return x.id===id;});
  if(t){t.status=t.status==='concluido'?'pendente':'concluido';salvarTarefaDB(t);renderTarefas(document.getElementById('pc'),document.getElementById('tb-actions'));}
}
</script>
<script>
// ══════════════════════════════════════════════════════
// ÁREA DA ALUNA
// ══════════════════════════════════════════════════════
function renderAluTabs(){
  var al=ALUNOS.find(function(a){return a.id===S.alunoId;});
  var temPlano=al&&al.planoHtml;
  var tabs=[{id:'dashboard',l:'🏠 Início'},{id:'minhas-aulas',l:'📖 Minhas Aulas'},
    {id:'progresso',l:'📊 Progresso'},{id:'materiais',l:'📁 Materiais'},
    {id:'jogos',l:'🎮 Jogos'},
    {id:'extras',l:'🎬 Aulas Extras'},{id:'financeiro',l:'💰 Financeiro'}].concat(temPlano?[{id:'plano',l:'📚 Meu Plano'}]:[]);
  var div=document.getElementById('alu-tabs');
  div.innerHTML='';
  tabs.forEach(function(t){
    var btn=document.createElement('button');
    btn.className='alu-tab'+(t.id==='dashboard'?' active':'');
    btn.textContent=t.l;
    btn.dataset.pg=t.id;
    btn.addEventListener('click',function(){goAluPage(this.dataset.pg);});
    div.appendChild(btn);
  });
}

function goAluPage(id){
  document.querySelectorAll('.alu-tab').forEach(function(b){b.classList.toggle('active',b.dataset.pg===id);});
  var c=document.getElementById('alu-pc');
  var pages={dashboard:renderAluDash,'minhas-aulas':renderAluAulas,progresso:renderAluProgresso,
    materiais:renderAluMateriais,jogos:renderAluJogos,extras:renderAluExtras,financeiro:renderAluFinanceiro,plano:renderAluPlano};
  (pages[id]||function(c){c.innerHTML='<div class="card" style="text-align:center;padding:40px;color:var(--crose)">Em breve!</div>';})(c);
}

function renderAluDash(c){
  var al=ALUNOS.find(function(a){return a.id===S.alunoId;});if(!al) return;
  var mv=motiv();
  var teacher=getTeacher(al.teacherId);
  // Horários da aluna
  var horariosAluna=Object.keys(HORARIOS).filter(function(k){return slotTemAluno(HORARIOS[k],al.id);});
  var horariosHtml='';
  if(horariosAluna.length){
    horariosHtml='<div class="card" style="margin-bottom:14px"><div class="ch"><i class="ti ti-calendar-time"></i><h3>Meus horários de aula</h3></div>'
      +'<div style="display:flex;flex-wrap:wrap;gap:8px">'
      +horariosAluna.map(function(k){
        var p=k.split('_');var dia=p[1];var hora=p[2];
        return '<div style="background:linear-gradient(135deg,var(--cd),var(--cr));border-radius:10px;padding:12px 16px;color:var(--ccream)">'
          +'<div style="font-size:14px;font-weight:700">'+hora+'</div>'
          +'<div style="font-size:11px;opacity:.8">'+fmtDateBr(dia)+'</div>'
          +'</div>';
      }).join('')+'</div></div>';
  }
  c.innerHTML='<div class="alu-hero">'
    +'<div class="alu-hero-welcome">✨ Bem-vinda de volta,</div>'
    +'<div class="alu-hero-name">'+al.nome.split(' ')[0]+'!</div>'
    +'<div class="alu-hero-stats">'
    +'<div><div class="alu-hero-stat-v">'+al.nivel+'</div><div class="alu-hero-stat-l">Nível</div></div>'
    +'<div><div class="alu-hero-stat-v">'+al.freq+'%</div><div class="alu-hero-stat-l">Frequência</div></div>'
    +'<div><div class="alu-hero-stat-v">'+bdgFin(al)+'</div><div class="alu-hero-stat-l">Pagamento</div></div>'
    +'</div></div>'
    +horariosHtml
    +'<div class="motiv-card"><span class="motiv-emoji">'+mv.emoji+'</span><div class="motiv-txt">"'+mv.txt+'"</div><div class="motiv-sub">'+mv.sub+'</div></div>'
    +'<div class="card"><div class="ch"><i class="ti ti-school"></i><h3>Minha teacher</h3></div>'
    +'<div style="font-size:16px;font-weight:700;color:var(--cd)">'+teacher.nome+'</div>'
    +'<div style="font-size:12px;color:var(--crose);margin-top:4px">'+al.aulasSemana+'x por semana</div></div>';
}

function renderAluAulas(c){
  var al=ALUNOS.find(function(a){return a.id===S.alunoId;});if(!al) return;
  var aulas=AULAS.filter(function(r){return r.alunoId===al.id;}).sort(function(a,b){return b.data.localeCompare(a.data);});
  c.innerHTML='<div class="card"><div class="ch"><i class="ti ti-book"></i><h3>Histórico de aulas</h3></div>'
    +(aulas.length?aulas.map(function(r){
      return '<div style="padding:14px;background:rgba(121,20,40,.03);border-radius:10px;margin-bottom:10px;border:1px solid rgba(121,20,40,.07)">'
        +'<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">'
        +'<div style="font-weight:700;color:var(--cd)">'+fmtDateBr(r.data)+'</div>'+bdg(r.presenca)+'</div>'
        +((r.topico||r.pagina)?'<div style="font-size:12px;font-weight:700;color:var(--cr);margin-bottom:4px">'+(r.topico?'📌 '+r.topico:'')+(r.topico&&r.pagina?' · ':'')+(r.pagina?'📄 Página '+r.pagina:'')+'</div>':'')
        +(r.conteudo?'<div style="font-size:12px;color:var(--cd);margin-bottom:4px">📖 '+r.conteudo+'</div>':'')
        +(r.desempenho?'<div style="font-size:11px;color:var(--crose)">Desempenho: '+r.desempenho+'</div>':'')
        +(r.homework?'<div style="font-size:11px;color:var(--crose)">Homework: '+r.homework+'</div>':'')
        +'</div>';
    }).join(''):'<div style="text-align:center;padding:40px;color:var(--crose)">Nenhuma aula registrada ainda.</div>')+'</div>';
}

function renderAluProgresso(c){
  var al=ALUNOS.find(function(a){return a.id===S.alunoId;});if(!al) return;
  var aulas=AULAS.filter(function(r){return r.alunoId===al.id&&r.presenca==='Presente';}).length;
  c.innerHTML='<div class="card"><div class="ch"><i class="ti ti-chart-bar"></i><h3>Meu progresso</h3></div>'
    +'<div class="sg g3">'
    +'<div class="sc"><div class="sl">Nível atual</div><div class="sv">'+al.nivel+'</div></div>'
    +'<div class="sc"><div class="sl">Aulas feitas</div><div class="sv">'+aulas+'</div></div>'
    +'<div class="sc"><div class="sl">Frequência</div><div class="sv">'+al.freq+'%</div></div>'
    +'</div></div>';
}

function renderAluPlano(c){
  var al=ALUNOS.find(function(a){return a.id===S.alunoId;});
  if(!al||!al.planoHtml){
    c.innerHTML='<div class="card" style="text-align:center;padding:60px;color:var(--crose)">'
      +'<i class="ti ti-notebook" style="font-size:48px;display:block;margin-bottom:12px"></i>'
      +'<div style="font-size:14px;font-weight:600;color:var(--cd)">Nenhum plano de estudos</div>'
      +'<div style="font-size:12px;margin-top:6px">Seu plano de estudos aparecerá aqui quando sua teacher carregar.</div></div>';
    return;
  }
  var prog=al.planoProgresso||[];
  var pct=al.planoHtml?Math.round(prog.length/30*100):0;
  c.innerHTML='<div class="card" style="padding:0;overflow:hidden">'
    +'<div style="padding:14px 18px;border-bottom:1px solid rgba(121,20,40,.1);display:flex;align-items:center;gap:12px">'
    +'<div style="flex:1"><div style="font-size:12px;font-weight:700;color:var(--cr);margin-bottom:4px">📚 Meu Plano de Estudos</div>'
    +'<div style="background:rgba(121,20,40,.1);border-radius:99px;height:6px;overflow:hidden">'
    +'<div id="plano-pct-fill" style="background:var(--cr);height:100%;border-radius:99px;width:'+pct+'%;transition:width .4s"></div></div></div>'
    +'<div id="plano-pct" style="font-size:13px;font-weight:700;color:var(--cr)">'+pct+'%</div>'
    +'<div style="display:flex;gap:4px;align-items:center">'
    +'<button class="btn btn-ghost btn-sm" onclick="ajustarZoomPlano(-0.1)" title="Diminuir">A−</button>'
    +'<span id="plano-zoom-lbl" style="font-size:11px;color:var(--crose);min-width:34px;text-align:center">'+Math.round(_planoZoom*100)+'%</span>'
    +'<button class="btn btn-ghost btn-sm" onclick="ajustarZoomPlano(0.1)" title="Aumentar">A+</button>'
    +'</div></div>'
    +'<iframe id="plano-frame" style="width:100%;height:82vh;border:none" sandbox="allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox"></iframe>'
    +'</div>';
  // Injetar HTML no iframe + sincronizar progresso
  setTimeout(function(){
    var iframe=document.getElementById('plano-frame');
    if(!iframe) return;
    var doc=iframe.contentDocument||iframe.contentWindow.document;
    // Modificar o HTML do plano para usar progresso salvo
    var planoMod=al.planoHtml;
    // Garante viewport para celular
    if(planoMod.indexOf('name="viewport"')===-1&&planoMod.indexOf("name='viewport'")===-1){
      planoMod=planoMod.replace(/<head([^>]*)>/i,'<head$1><meta name="viewport" content="width=device-width, initial-scale=1">');
    }
    // Semeia o progresso salvo no banco (aceita var/let/const e espaçamentos diferentes)
    planoMod=planoMod.replace(/(var|let|const)(\s+done\s*=\s*new\s+Set\s*\()\s*\)/,
      function(m,g1,g2){return g1+g2+JSON.stringify(prog)+')';});
    // Ponte universal: após qualquer clique, colhe o estado e envia à plataforma
    var ponte='<scr'+'ipt>(function(){'
      +'var INIT='+JSON.stringify(prog)+';'
      +'function colher(){try{'
      +'if(typeof done!=="undefined"&&done&&typeof done.forEach==="function"){'
      +'var arr=[];done.forEach(function(x){arr.push(x);});'
      +'parent.postMessage({type:"plano-progresso",done:arr},"*");'
      +'}}catch(e){}}'
      +'window.addEventListener("load",function(){setTimeout(function(){try{'
      +'if(typeof done!=="undefined"&&done&&done.add&&done.size===0&&INIT.length){'
      +'INIT.forEach(function(d){done.add(d);});'
      +'if(typeof renderAll==="function")renderAll();'
      +'else if(typeof render==="function")render();'
      +'else if(typeof update==="function")update();'
      +'}}catch(e){}},200);});'
      +'document.addEventListener("click",function(e){'
      +'var a=e.target&&e.target.closest?e.target.closest("a[href]"):null;'
      +'if(a){var h=a.getAttribute("href")||"";'
      +'if(/^https?:/i.test(h)){e.preventDefault();window.open(h,"_blank");}}'
      +'setTimeout(colher,180);},true);'
      +'document.addEventListener("change",function(){setTimeout(colher,180);},true);'
      +'})();</scr'+'ipt>';
    if(planoMod.indexOf('</body>')>-1)planoMod=planoMod.replace('</body>',ponte+'</body>');
    else planoMod+=ponte;
    doc.open(); doc.write(planoMod); doc.close();
    // Aplica o zoom escolhido (ou ajuste automático em telas pequenas)
    setTimeout(function(){
      if(window.innerWidth<600&&_planoZoom===1)_planoZoom=0.8;
      if(doc.body)doc.body.style.zoom=_planoZoom;
      var lbl=document.getElementById('plano-zoom-lbl');
      if(lbl)lbl.textContent=Math.round(_planoZoom*100)+'%';
    },150);
  },100);
}
var _planoZoom=1;
function ajustarZoomPlano(d){
  _planoZoom=Math.min(1.6,Math.max(0.4,Math.round((_planoZoom+d)*10)/10));
  var iframe=document.getElementById('plano-frame');
  if(iframe&&iframe.contentDocument&&iframe.contentDocument.body)iframe.contentDocument.body.style.zoom=_planoZoom;
  var lbl=document.getElementById('plano-zoom-lbl');
  if(lbl)lbl.textContent=Math.round(_planoZoom*100)+'%';
}
// Ouvir mensagens de progresso do iframe
var _salvarProgTimer=null;
window.addEventListener('message',function(e){
  if(!e.data||e.data.type!=='plano-progresso') return;
  var al=ALUNOS.find(function(a){return a.id===S.alunoId;});
  if(!al) return;
  var novo=e.data.done||[];
  var mudou=JSON.stringify(novo)!==JSON.stringify(al.planoProgresso||[]);
  al.planoProgresso=novo;
  // Atualiza a barra e o número na hora
  var pct=Math.min(100,Math.round(novo.length/30*100));
  var fill=document.getElementById('plano-pct-fill');
  var num=document.getElementById('plano-pct');
  if(fill)fill.style.width=pct+'%';
  if(num)num.textContent=pct+'%';
  // Salva no banco com uma pequena pausa (evita salvar 10x em cliques seguidos)
  if(mudou){
    if(_salvarProgTimer)clearTimeout(_salvarProgTimer);
    _salvarProgTimer=setTimeout(function(){salvarAlunaDB(al);},900);
  }
});

  if(f.size>4*1024*1024){showToast('⚠️ Arquivo muito grande (máx. 4 MB).');return;}
  var reader=new FileReader();
  reader.onload=function(e){
    window._jogoHtmlPendente=e.target.result;
    var nomeEl=document.getElementById('jog-arquivo-nome');
    if(nomeEl) nomeEl.textContent='✅ '+f.name+' carregado';
  };
  reader.readAsText(f,'UTF-8');
}

<script>
// ══════════════════════════════════════════════════════
// MÓDULOS: SUPORTE / COBRANÇA / EXPERIÊNCIA
// ══════════════════════════════════════════════════════
var SUPORTE=[],COBRANCA=[],EXPERIENCIA=[];

// ── Carregar dados na abertura da página (antes de qualquer login) ──
var _dadosProntos=null;
var _dadosCarregados=false;
function garantirDados(){
  if(!_dadosProntos)_dadosProntos=carregarDados().then(function(){atualizarDiasInadimplente();_dadosCarregados=true;});
  return _dadosProntos;
}
if(document.readyState==='loading'){
  document.addEventListener('DOMContentLoaded',function(){garantirDados();});
}else{
  garantirDados();
}

// ── Selo de versão (para conferir se o deploy atualizou) ──
var BUILD_VERSAO='v19.out.S';
(function(){
  var b=document.createElement('div');
  b.textContent=BUILD_VERSAO;
  b.style.cssText='position:fixed;bottom:6px;right:8px;font-size:10px;color:rgba(121,20,40,.45);z-index:9998;pointer-events:none;font-weight:700';
  if(document.body)document.body.appendChild(b);
  else document.addEventListener('DOMContentLoaded',function(){document.body.appendChild(b);});
})();

// ── Estilos (nomes clicáveis + módulos) ──
(function(){
  var st=document.createElement('style');
  st.textContent='.pf-gestao td.nm[data-alid]{cursor:pointer}'
